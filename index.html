<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Robot Fight 3D - IA vs IA</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0a0e1a;color:#fff;overflow:hidden;user-select:none;touch-action:none}
  #c{position:fixed;inset:0;display:block}
  .hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;justify-content:space-between;pointer-events:none;z-index:5}
  .card{flex:1;background:rgba(10,15,35,.75);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px;backdrop-filter:blur(6px)}
  .name{font-weight:800;font-size:14px;letter-spacing:.3px}
  .bar{height:14px;background:#222a44;border-radius:99px;margin-top:6px;overflow:hidden;border:1px solid #ffffff33}
  .fill{height:100%;width:100%;transition:width .25s}
  .hp{background:linear-gradient(90deg,#22c55e,#a3e635)}
  .hp.low{background:linear-gradient(90deg,#ef4444,#f97316)}
  .en{background:linear-gradient(90deg,#38bdf8,#818cf8)} .enbar{height:8px}
  .center{text-align:center;min-width:92px}
  #timer{font-size:26px;font-weight:900;line-height:1}
  .tag{font-size:11px;opacity:.8}
  #banner{position:fixed;top:18%;width:100%;text-align:center;font-size:42px;font-weight:900;text-shadow:0 4px 20px #000;z-index:20;display:none}
  #toast{position:fixed;bottom:182px;width:100%;text-align:center;font-weight:700;text-shadow:0 2px 8px #000;z-index:10;pointer-events:none}
  .controls{position:fixed;left:0;right:0;bottom:0;height:170px;display:flex;justify-content:space-between;align-items:flex-end;padding:12px;z-index:6;pointer-events:none}
  #joyBase{width:126px;height:126px;border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.35);position:relative;pointer-events:auto}
  #joyKnob{width:58px;height:58px;border-radius:50%;background:#e2e8f0;position:absolute;left:34px;top:34px;box-shadow:0 4px 14px #000}
  .btns{display:grid;grid-template-columns:70px 70px;gap:10px;pointer-events:auto}
  button{border:0;border-radius:50%;font-weight:900;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.35)}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .b1{width:70px;height:70px;background:#2563eb;font-size:22px}
  .b2{width:70px;height:70px;background:#dc2626;font-size:22px}
  .b3{width:70px;height:70px;background:#7c3aed;font-size:18px;grid-column:span 2;width:100%}
  .topbtns{position:fixed;top:96px;left:10px;display:flex;gap:8px;z-index:7;flex-wrap:wrap;max-width:100vw}
  .topbtns button, .topbtns select{border-radius:99px;padding:10px 14px;background:#1e293b;border:1px solid #fff3;font-size:13px;color:#fff;box-shadow:none;outline:none}
  .topbtns select{background:#0f172a}
  #hint{text-align:center;font-size:12px;opacity:.85;margin-top:4px}
  @media(min-width:800px){.controls{height:150px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="card">
    <div class="name">🔵 TITÁN AZUL <span id="youTag" class="tag">TÚ</span></div>
    <div class="bar"><div id="hp1" class="fill hp"></div></div>
    <div class="bar enbar"><div id="en1" class="fill en"></div></div>
    <div id="hint">Estilo IA: <span id="style1">-</span></div>
  </div>
  <div class="card center">
    <div id="timer">99</div>
    <div class="tag">RONDA</div>
    <div id="wins" class="tag">0 - 0</div>
  </div>
  <div class="card" style="text-align:right">
    <div class="name">🔴 VOLT ROJO <span class="tag" id="personaTag">🧠 ADAPTATIVA</span></div>
    <div class="bar"><div id="hp2" class="fill hp"></div></div>
    <div class="bar enbar"><div id="en2" class="fill en"></div></div>
    <div id="hint">Bloqueo: <span id="blockStat">0%</span> · Contra: <span id="counterStat">0</span></div>
  </div>
</div>

<div class="topbtns">
  <button id="autoBtn">🤖 AUTO: ON</button>
  <select id="personaSel" title="Personalidad de VOLT ROJO">
    <option value="adaptativa">🧠 Adaptativa</option>
    <option value="agresiva">🔥 Agresiva</option>
    <option value="defensiva">🛡️ Defensiva</option>
    <option value="tramposa">🎲 Tramposa</option>
    <option value="grok">🤪 Grok</option>
    <option value="chatgpt">💬 ChatGPT</option>
    <option value="claude">🧭 Claude</option>
    <option value="deepseek">🔍 DeepSeek</option>
  </select>
  <button id="resetBtn">↻ Reiniciar</button>
</div>

<div id="banner"></div>
<div id="toast"></div>

<div class="controls">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div class="btns">
    <button class="b1" id="punch">👊</button>
    <button class="b2" id="kick">🦵</button>
    <button class="b3" id="special">⚡ ESPECIAL</button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e1a);
scene.fog = new THREE.Fog(0x0a0e1a, 18, 38);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 100);
camera.position.set(0,7,11);

scene.add(new THREE.HemisphereLight(0xbfd7ff,0x1a1030,1.2));
const sun = new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(6,12,6); sun.castShadow=true; scene.add(sun);
const rim = new THREE.PointLight(0x38bdf8,30,20); rim.position.set(-5,4,-4); scene.add(rim);

// Arena
const arena = new THREE.Group(); scene.add(arena);
const floor = new THREE.Mesh(new THREE.CylinderGeometry(9,9,.6,48), new THREE.MeshStandardMaterial({color:0x182544, metalness:.3, roughness:.6}));
floor.receiveShadow=true; arena.add(floor);
const ring = new THREE.Mesh(new THREE.RingGeometry(7.6,8.6,48), new THREE.MeshBasicMaterial({color:0x38bdf8, side:THREE.DoubleSide}));
ring.rotation.x=-Math.PI/2; ring.position.y=.32; arena.add(ring);
for(let i=0;i<10;i++){
  const h = 1+Math.random()*3;
  const box = new THREE.Mesh(new THREE.BoxGeometry(.8,h,.8), new THREE.MeshStandardMaterial({color:0x0f172a, emissive:0x1d4ed8, emissiveIntensity:.35}));
  const a=i/10*Math.PI*2; box.position.set(Math.cos(a)*11,h/2,Math.sin(a)*11); arena.add(box);
}

function makeRobot(color, accent){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color, metalness:.75, roughness:.28});
  const dark=new THREE.MeshStandardMaterial({color:0x111827, metalness:.6, roughness:.4});
  const glow=new THREE.MeshStandardMaterial({color:accent, emissive:accent, emissiveIntensity:2});
  const torso=new THREE.Mesh(new THREE.BoxGeometry(1.15,.95,.72),mat); torso.position.y=1.25; torso.castShadow=true; g.add(torso);
  const chest=new THREE.Mesh(new THREE.BoxGeometry(.72,.42,.08),glow); chest.position.set(0,1.35,.4); g.add(chest);
  const head=new THREE.Mesh(new THREE.BoxGeometry(.62,.5,.55),mat); head.position.y=2.02; head.castShadow=true; g.add(head);
  const eyeL=new THREE.Mesh(new THREE.BoxGeometry(.13,.08,.06),glow); eyeL.position.set(-.16,2.05,.3); g.add(eyeL);
  const eyeR=eyeL.clone(); eyeR.position.x=.16; g.add(eyeR);
  const armL=new THREE.Group(); armL.position.set(-.72,1.55,0); g.add(armL);
  const armR=new THREE.Group(); armR.position.set(.72,1.55,0); g.add(armR);
  for(const arm of [armL,armR]){
    const a=new THREE.Mesh(new THREE.BoxGeometry(.28,.85,.28),mat); a.position.y=-.35; a.castShadow=true; arm.add(a);
    const fist=new THREE.Mesh(new THREE.BoxGeometry(.38,.3,.38),dark); fist.position.y=-.85; arm.add(fist);
  }
  const legL=new THREE.Group(); legL.position.set(-.32,.82,0); g.add(legL);
  const legR=new THREE.Group(); legR.position.set(.32,.82,0); g.add(legR);
  for(const leg of [legL,legR]){
    const l=new THREE.Mesh(new THREE.BoxGeometry(.34,.78,.34),dark); l.position.y=-.35; leg.add(l);
    const foot=new THREE.Mesh(new THREE.BoxGeometry(.4,.16,.55),mat); foot.position.set(0,-.78,.06); leg.add(foot);
  }
  g.userData={armL,armR,legL,legR,head,torso};
  return g;
}

class Fighter{
  constructor(mesh, name, isAI){
    this.mesh=mesh; this.name=name; this.isAI=isAI;
    this.hp=100; this.energy=40; this.pos=mesh.position;
    this.vel=new THREE.Vector3(); this.facing=0;
    this.state='idle'; this.timer=0; this.cooldown=0; this.hurt=0;
    this.blocking=false; this.attackType=null;
    // Adaptativa
    this.memory={closeAttacks:0, farAttacks:0, blocks:0, counters:0, hitsTaken:0, lastOppMove:0, aggression:.45, defense:.35, danger:0};
    // Personalidad de IA rival (seleccionable)
    this.persona='adaptativa';
    this.personaCfg={
      adaptativa:{ label:'🧠 ADAPTATIVA', aggr:.4, def:.35, speed:3.6, dmgBonus:1.0, desc:'Aprende de tu patrón' },
      agresiva:  { label:'🔥 AGRESIVA',   aggr:.92, def:.12, speed:4.6, dmgBonus:1.25, desc:'Ataca sin parar' },
      defensiva: { label:'🛡️ DEFENSIVA', aggr:.22, def:.92, speed:2.9, dmgBonus:0.9,  desc:'Bloquea y contraataca' },
      tramposa:  { label:'🎲 TRAMPOSA',   aggr:.6,  def:.5,  speed:3.8, dmgBonus:1.1,  desc:'Esquiva y te engaña' },
      grok:      { label:'🤪 GROK',       aggr:.86, def:.18, speed:4.8, dmgBonus:1.2,  desc:'Caos total, sin patrón' },
      chatgpt:   { label:'💬 CHATGPT',    aggr:.55, def:.55, speed:3.4, dmgBonus:1.05, desc:'Estratégico, analiza y responde' },
      claude:    { label:'🧭 CLAUDE',     aggr:.34, def:.82, speed:3.1, dmgBonus:0.95, desc:'Paciente, calcula tu error' },
      deepseek:  { label:'🔍 DEEPSEEK',   aggr:.5,  def:.6,  speed:3.5, dmgBonus:1.0,  desc:'Busca tu debilidad' }
    };
  }
  cfg(){ return this.personaCfg[this.persona] || this.personaCfg.adaptativa; }
  reset(x,z){ this.hp=100; this.energy=40; this.pos.set(x,.3,z); this.vel.set(0,0,0); this.state='idle'; this.timer=0; }
  hit(dmg, attacker){
    if(this.blocking && Math.random()<.75){ 
      if(attacker) attacker.memory.counters++;
      this.memory.blocks++; this.flash(0x93c5fd); showToast('¡BLOQUEO!'); this.energy=Math.min(100,this.energy+6); return 0;
    }
    this.hp=Math.max(0,this.hp-dmg); this.hurt=.25; this.memory.hitsTaken++;
    this.flash(0xff4444); burst(this.pos.x,1.5,this.pos.z,0xffaa00);
    this.energy=Math.min(100,this.energy+4);
    showDmg(this.pos, dmg);
    return dmg;
  }
  flash(c){ this.mesh.traverse(o=>{ if(o.material && o.material.emissive){ o.material.emissive.setHex(c); setTimeout(()=>o.material.emissive.setHex(0x000000),90); }}); }
}

const p1mesh=makeRobot(0x2563eb,0x38bdf8); scene.add(p1mesh);
const p2mesh=makeRobot(0xdc2626,0xff6600); scene.add(p2mesh);
const p1=new Fighter(p1mesh,'TITÁN AZUL',false);
const p2=new Fighter(p2mesh,'VOLT ROJO',true);
p1.reset(-3,0); p2.reset(3,0);

const particles=[];
function burst(x,y,z,color){
  for(let i=0;i<14;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(.07,6,6),new THREE.MeshBasicMaterial({color}));
    m.position.set(x,y,z); m.userData.v=new THREE.Vector3((Math.random()-.5)*5,Math.random()*4+2,(Math.random()-.5)*5);
    m.userData.life=1; scene.add(m); particles.push(m);
  }
}
const dmgLayer=document.createElement('div'); document.body.appendChild(dmgLayer);
function showDmg(pos, dmg){
  const el=document.createElement('div'); el.textContent='-'+dmg;
  el.style.cssText=`position:fixed;left:${innerWidth/2 + (Math.random()*80-40)}px;top:38%;font-size:28px;font-weight:900;color:#fde68a;text-shadow:0 2px 8px #000;z-index:15;pointer-events:none`;
  dmgLayer.appendChild(el); setTimeout(()=>el.remove(),800);
}
function showToast(t){ const e=document.getElementById('toast'); e.textContent=t; setTimeout(()=>e.textContent='',700); }

let autoMode=true, roundOver=false;
const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

const joy={x:0,y:0,active:false,id:null};
const base=document.getElementById('joyBase'), knob=document.getElementById('joyKnob');
function setKnob(dx,dy){ knob.style.left=(34+dx*32)+'px'; knob.style.top=(34+dy*32)+'px'; }
base.addEventListener('touchstart',e=>{joy.active=true;joy.id=e.changedTouches[0].identifier},{passive:false});
base.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=[...e.changedTouches].find(t=>t.identifier===joy.id); if(!t)return;
  const r=base.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=(t.clientX-cx)/45, dy=(t.clientY-cy)/45; const m=Math.hypot(dx,dy); if(m>1){dx/=m;dy/=m;}
  joy.x=dx; joy.y=dy; setKnob(dx,dy);
},{passive:false});
const endTouch=e=>{ if([...e.changedTouches].some(t=>t.identifier===joy.id)){joy.x=joy.y=0;joy.active=false;setKnob(0,0);} };
base.addEventListener('touchend',endTouch); base.addEventListener('touchcancel',endTouch);

function bindBtn(id, fn){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();fn();},{passive:false});
  el.addEventListener('click',fn);
}
bindBtn('punch',()=>tryAttack(p1,'punch'));
bindBtn('kick',()=>tryAttack(p1,'kick')) ;
bindBtn('special',()=>tryAttack(p1,'special'));

document.getElementById('autoBtn').onclick=e=>{autoMode=!autoMode; e.target.textContent=autoMode?'🤖 AUTO: ON':'🎮 MANUAL';};
document.getElementById('personaSel').onchange=e=>{
  p2.persona=e.target.value;
  const cfg=p2.cfg();
  document.getElementById('personaTag').textContent=cfg.label;
  showToast(cfg.label+' · '+cfg.desc);
  p2.memory.closeAttacks=0; p2.memory.farAttacks=0; p2.memory.blocks=0; p2.memory.counters=0;
};
document.getElementById('resetBtn').onclick=()=>{p1.reset(-3,0);p2.reset(3,0);roundOver=false;document.getElementById('banner').style.display='none';};

function faceTo(f, other){ f.facing=Math.atan2(other.pos.x-f.pos.x, other.pos.z-f.pos.z); f.mesh.rotation.y=f.facing; }
function dist(a,b){ return a.pos.distanceTo(b.pos); }

function tryAttack(f,type){
  if(roundOver||f.cooldown>0||f.hurt>0) return;
  if(type==='special' && f.energy<35){ showToast('Necesitas 35⚡'); return; }
  f.state='attack'; f.timer=.32; f.attackType=type;
  f.cooldown = type==='special'?.9:(type==='kick'?.55:.38);
  if(type==='special') f.energy-=35;
  const target = f===p1?p2:p1;
  // Adaptive memory: tracks opponent patterns
  if(f===p1){
    if(dist(p1,p2)<3.2) p2.memory.closeAttacks++;
    else p2.memory.farAttacks++;
  }
  setTimeout(()=>{
    if(roundOver) return;
    if(dist(f,target)<3.4){
      let dmg = type==='special'?22:(type==='kick'?14:9);
      if(f===p2) dmg=Math.round(dmg*(0.85+p2.memory.aggression*.4)*p2.cfg().dmgBonus);
      target.hit(dmg,f);
      if(type==='special') burst(target.pos.x,1.4,target.pos.z,0xa78bfa);
      // Tramposa: a veces esquiva por completo el primer golpe
      if(f===p1 && p2.persona==='tramposa' && Math.random()<0.18){
        p2.pos.x += (Math.random()<.5?-1.2:1.2); clampArena(p2);
        showToast('¡VOLT te esquivó! 🎲');
      }
      // Grok también esquiva a veces, pero por caos
      if(f===p1 && p2.persona==='grok' && Math.random()<0.12){
        p2.pos.x += (Math.random()<.5?-1:1); clampArena(p2);
        showToast('¡Grok se movió por caos! 🤪');
      }
      if(target.hp<=0) endRound(f);
    }
  },140);
}

function adaptiveBrain(dt){
  // La IA aprende según su personalidad: si el jugador ataca mucho de cerca → sube defensa; si se aleja → persigue más
  const m=p2.memory;
  const cfg=p2.cfg();
  const learnedDef = Math.min(.9, cfg.def + m.closeAttacks*.03 + m.blocks*.02);
  const learnedAggr = Math.min(.95, cfg.aggr + (m.farAttacks> m.closeAttacks? .08:0) + (100-p2.hp)*.002);
  if(p2.persona==='adaptativa'){
    m.defense=learnedDef; m.aggression=learnedAggr;
  } else if(p2.persona==='agresiva'){
    m.defense=.12; m.aggression=.92;
  } else if(p2.persona==='defensiva'){
    m.defense=.92; m.aggression=.22;
  } else if(p2.persona==='tramposa'){
    // Tramposa alterna entre presionar y huir para engañar, influida por su memoria
    m.defense=.5; m.aggression=.6 + (Math.random()<.02 ? (Math.random()-.5)*.4 : 0);
  } else if(p2.persona==='grok'){
    // Grok: caos total, ignora memoria — hace movimientos impredecibles, ataca aunque esté lejos, a veces se queda quieto
    m.defense=Math.random()*.5; m.aggression=.86;
  } else if(p2.persona==='chatgpt'){
    // ChatGPT: estratégico equilibrado, analiza distancia y usa especial cuando tiene energía
    m.defense=Math.min(.9, .55 + (m.closeAttacks>6 ? .2 : 0));
    m.aggression=.55 + (p2.energy>70 ? .25 : 0);
  } else if(p2.persona==='claude'){
    // Claude: paciente y defensiva, deja que te canses  (espera y contraataca)
    m.defense=.82; m.aggression=.34 + (p1.hp < p2.hp ? .15 : 0);
  } else if(p2.persona==='deepseek'){
    // DeepSeek: busca debilidad — si atacas mucho de cerca, persigue y usa patada; si huyes, carga especial
    m.defense=Math.min(.9, .6 + m.closeAttacks*.02);
    m.aggression=.5 + (m.farAttacks > m.closeAttacks ? .25 : 0);
  }
  m.danger += (p1.state==='attack'?1:0)*dt;

  if(p2.hurt>0||roundOver) return;
  const d=dist(p1,p2);
  faceTo(p2,p1);
  p2.timer-=dt; p2.cooldown-=dt;
  if(p2.state==='attack'&&p2.timer>0) return;
  if(p2.state==='attack') p2.state='idle';

  // Decisión con memoria + personalidad
  const r=Math.random();
  const speed=cfg.speed;
  // Frases según personalidad
  if(Math.random()<.012){
    const phrases={
      grok:['¡JA! 🤪','¿Eso es todo?','¡Mi caos te gana!','Jeee, predecible no soy'],
      chatgpt:['Analizando... 💬','Estrategia calculada ✔','Respuesta óptima','Calibrando ataque'],
      claude:['Con calma... 🧭','El truco es la paciencia','Calculé ese golpe','Ahora sí, mi turno'],
      deepseek:['Buscando patrón... 🔍','Tu debilidad: cerca','Copiando tu estilo','Detectada tu falla'],
      tramposa:['¿Me viste? 🎲','Truco aprendido','Casi me atrapas']
    };
    const arr=phrases[p2.persona] || phrases.tramposa;
    if(arr) showToast(arr[Math.floor(Math.random()*arr.length)]);
  }
  if(p2.persona==='tramposa' && Math.random()<0.10){
    // Truco: esquiva lateral rápido y luego contraataca
    moveAI(Math.random()<.5?-2.2:2.2, -1, speed*dt);
    if(r<m.aggression*.8 && p2.cooldown<=0){ setTimeout(()=>{if(!roundOver){p2.blocking=false; tryAttack(p2,'special');}},180); }
  }
  else if(p2.persona==='grok' && Math.random()<0.20){
    // Grok hace giros locos sin importar la distancia
    moveAI(Math.random()<.5?-2:2, -1.5, speed*1.2*dt);
    if(Math.random()<.7 && p2.cooldown<=0){ const a=['punch','kick','special']; tryAttack(p2, a[Math.floor(Math.random()*3)]); }
  }
  else if(p2.persona==='claude' && d>3 && Math.random()<0.10){
    // Claude espera paciente, deja que te acerques
    // no attack, solo espera
  }
  else if(p2.persona==='chatgpt' && p2.energy>=35 && d<=5 && Math.random()<0.18){
    tryAttack(p2,'special'); // ChatGPT usa especial estratégico
  }
  else if(Math.random()<m.defense) { p2.blocking=true; p2.state='block'; p2.timer=.5+.4*m.defense; 
    if(r<m.aggression*.6 && p2.cooldown<=0){ setTimeout(()=>{if(!roundOver){p2.blocking=false; tryAttack(p2,'punch');}},220); }
  }
  else if(d>4.5){ moveAI(0,1,speed*dt); if(r<m.aggression) tryAttack(p2,'special'); }
  else if(d>2.6){ moveAI(0,1,speed*dt); if(r<m.aggression*.7) tryAttack(p2, Math.random()<.4?'kick':'punch'); }
  else { // cerca
    if(r<m.aggression) tryAttack(p2, Math.random()<.5?'punch':'kick');
    else if(r<m.aggression+m.defense*.5){ p2.blocking=true; p2.state='block'; p2.timer=.4; }
    else moveAI(1,0,speed*.55*dt); // esquiva lateral
  }
  if(p2.state==='block'&&p2.timer<=0){p2.blocking=false;p2.state='idle';}
  p2.energy=Math.min(100,p2.energy+dt*3);
  document.getElementById('style1').textContent = cfg.label;
  document.getElementById('blockStat').textContent = Math.round(m.defense*100)+'%';
  document.getElementById('counterStat').textContent = m.counters;
}
function moveAI(x,z,speed){
  const fwd=new THREE.Vector3(Math.sin(p2.facing),0,Math.cos(p2.facing));
  const right=new THREE.Vector3(fwd.z,0,-fwd.x);
  p2.pos.addScaledVector(fwd,z*speed).addScaledVector(right,x*speed);
  clampArena(p2);
}
function clampArena(f){ f.pos.x=THREE.MathUtils.clamp(f.pos.x,-7.5,7.5); f.pos.z=THREE.MathUtils.clamp(f.pos.z,-7.5,7.5); }

let wins1=0,wins2=0,timeLeft=99;
function endRound(winner){
  roundOver=true;
  if(winner===p1) wins1++; else wins2++;
  document.getElementById('wins').textContent=`${wins1} - ${wins2}`;
  const b=document.getElementById('banner'); b.textContent=(winner===p1?'🏆 ¡TITÁN AZUL GANA!':'🤖 ¡VOLT ROJO GANA!'); b.style.display='block';
  burst(winner.pos.x,2,winner.pos.z,winner===p1?0x38bdf8:0xff6600);
  setTimeout(()=>{p1.reset(-3,0);p2.reset(3,0);roundOver=false;b.style.display='none';timeLeft=99;},2600);
}
setInterval(()=>{ if(!roundOver){timeLeft--; document.getElementById('timer').textContent=Math.max(0,timeLeft);
  if(timeLeft<=0){ endRound(p1.hp>=p2.hp?p1:p2); } } },1000);

function playerUpdate(dt){
  p1.timer-=dt; p1.cooldown-=dt; if(p1.hurt>0)p1.hurt-=dt;
  faceTo(p1,p2);
  let mx=0,mz=0;
  if(autoMode){
    // Ambos pelean solos cuando AUTO está ON (modo espectador IA vs IA)
    // Jugador actúa como segunda IA simple
    const d=dist(p1,p2);
    if(d>3) { mz=1; } else if(Math.random()<.02) tryAttack(p1,Math.random()<.5?'punch':'kick');
    if(d<2 && Math.random()<.01) mz=-.6;
  } else {
    if(keys['w']||keys['arrowup']) mz+=1; if(keys['s']||keys['arrowdown']) mz-=1;
    if(keys['a']||keys['arrowleft']) mx-=1; if(keys['d']||keys['arrowright']) mx+=1;
    mx+=joy.x; mz+=-joy.y;
    if(keys['j']) tryAttack(p1,'punch'); if(keys['k']) tryAttack(p1,'kick'); if(keys['l']) tryAttack(p1,'special');
  }
  const len=Math.hypot(mx,mz); if(len>1){mx/=len;mz/=len;}
  const fwd=new THREE.Vector3(Math.sin(p1.facing),0,Math.cos(p1.facing));
  const right=new THREE.Vector3(fwd.z,0,-fwd.x);
  p1.pos.addScaledVector(fwd,mz*3.6*dt).addScaledVector(right,mx*3.6*dt);
  clampArena(p1);
  p1.energy=Math.min(100,p1.energy+dt*3);
  // animación brazos
  const u=p1mesh.userData;
  if(p1.state==='attack'&&p1.timer>0){ u.armR.rotation.x=-1.6; if(p1.attackType==='kick') u.legR.rotation.x=-1.2; }
  else { u.armR.rotation.x=0; u.legR.rotation.x=0; }
  if(p1.blocking){ u.armL.rotation.x=-.9; u.armR.rotation.x=-.9; }
}

function aiAnim(dt){
  p2.timer-=dt; p2.cooldown-=dt; if(p2.hurt>0)p2.hurt-=dt;
  const u=p2mesh.userData;
  if(p2.state==='attack'&&p2.timer>0){ u.armR.rotation.x=-1.6; if(p2.attackType==='kick') u.legR.rotation.x=-1.2; }
  else { u.armR.rotation.x=0; u.legR.rotation.x=0; }
  if(p2.blocking){ u.armL.rotation.x=-.9; u.armR.rotation.x=-.9; }
  p2mesh.position.y = .3 + Math.sin(performance.now()*.006)*.04;
  p1mesh.position.y = .3 + Math.sin(performance.now()*.006+2)*.04;
}

const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,clock.getDelta());
  if(!roundOver){ playerUpdate(dt); adaptiveBrain(dt); aiAnim(dt); }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.userData.life-=dt*1.4; p.position.addScaledVector(p.userData.v,dt); p.userData.v.y-=6*dt;
    p.scale.setScalar(Math.max(.01,p.userData.life)); if(p.userData.life<=0){scene.remove(p); particles.splice(i,1);}
  }
  p1mesh.position.copy(p1.pos); p2mesh.position.copy(p2.pos);
  // cámara sigue el punto medio
  const mid=new THREE.Vector3().addVectors(p1.pos,p2.pos).multiplyScalar(.5);
  camera.position.lerp(new THREE.Vector3(mid.x*.6,7,11),.06);
  camera.lookAt(mid.x,1.2,mid.z);
  document.getElementById('hp1').style.width=p1.hp+'%'; document.getElementById('hp1').className='fill hp'+(p1.hp<30?' low':'');
  document.getElementById('hp2').style.width=p2.hp+'%'; document.getElementById('hp2').className='fill hp'+(p2.hp<30?' low':'');
  document.getElementById('en1').style.width=p1.energy+'%'; document.getElementById('en2').style.width=p2.energy+'%';
  renderer.render(scene,camera);
}
loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
