  @media(min-width:800px){.controls{height:150px}}

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e1a);
scene.fog = new THREE.Fog(0x0a0e1a, 18, 38);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 100);
camera.position.set(0,7,11);

scene.add(new THREE.HemisphereLight(0xbfd7ff,0x1a1030,1.2));
const sun = new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(6,12,6); sun.castShadow=true; scene.add(sun);
const rim = new THREE.PointLight(0x38bdf8,30,20); rim.position.set(-5,4,-4); scene.add(rim);

// Arena
const arena = new THREE.Group(); scene.add(arena);
const floor = new THREE.Mesh(new THREE.CylinderGeometry(9,9,.6,48), new THREE.MeshStandardMaterial({color:0x182544, metalness:.3, roughness:.6}));
floor.receiveShadow=true; arena.add(floor);
const ring = new THREE.Mesh(new THREE.RingGeometry(7.6,8.6,48), new THREE.MeshBasicMaterial({color:0x38bdf8, side:THREE.DoubleSide}));
ring.rotation.x=-Math.PI/2; ring.position.y=.32; arena.add(ring);
for(let i=0;i<10;i++){
  const h = 1.6+Math.random()*2.4;
  const col = new THREE.Mesh(new THREE.CylinderGeometry(.32,.42,h,10), new THREE.MeshStandardMaterial({color:0x0f172a, metalness:.7, roughness:.35}));
  const cap = new THREE.Mesh(new THREE.SphereGeometry(.34,12,10), new THREE.MeshStandardMaterial({color:0x1d4ed8, emissive:0x3b82f6, emissiveIntensity:1.2}));
  const a=i/10*Math.PI*2;
  col.position.set(Math.cos(a)*11,h/2,Math.sin(a)*11);
  cap.position.set(Math.cos(a)*11,h+.3,Math.sin(a)*11);
  arena.add(col,cap);
}

// ── Escenario destructible: 4 pilares de piedra dentro de la arena ──────────
const pillars=[];
function buildPillars(){
  const spots=[[-4.8,-2.6],[4.8,-2.6],[-4.8,2.6],[4.8,2.6]];
  for(const [x,z] of spots){
    const g=new THREE.Group();
    const mat=new THREE.MeshStandardMaterial({color:0x9aa3ad, metalness:.25, roughness:.8});
    const base=new THREE.Mesh(new THREE.BoxGeometry(1.4,.5,1.4),mat); base.position.y=.25; base.castShadow=true; g.add(base);
    const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.5,.62,2.8,8),mat); shaft.position.y=1.9; shaft.castShadow=true; g.add(shaft);
    const cap=new THREE.Mesh(new THREE.BoxGeometry(1.3,.45,1.3),mat); cap.position.y=3.5; cap.castShadow=true; g.add(cap);
    const crystal=new THREE.Mesh(new THREE.OctahedronGeometry(.24), new THREE.MeshStandardMaterial({color:0x22d3ee, emissive:0x22d3ee, emissiveIntensity:2.2}));
    crystal.position.y=4.05; g.add(crystal);
    g.position.set(x,.3,z);
    arena.add(g);
    pillars.push({group:g, mat, crystal, x, z, hp:32, maxHp:32, alive:true, wobble:0});
  }
}
buildPillars();
function resetPillars(){
  for(const p of pillars){
    p.hp=p.maxHp; p.alive=true; p.wobble=0;
    p.group.rotation.set(0,0,0); p.group.position.y=.3;
    p.mat.color.setHex(0x9aa3ad);
    if(p.group.parent!==arena) arena.add(p.group);
    p.group.visible=true;
  }
}
function destroyPillar(p, attacker){
  p.alive=false;
  arena.remove(p.group);
  burst(p.x,2,p.z,0x9aa3ad); burst(p.x,1,p.z,0x22d3ee); burst(p.x,3,p.z,0xfbbf24);
  shakeT=.55; sfx('slam');
  showToast('💥 ¡PILAR DESTRUIDO! '+(attacker?'+20⚡':''));
  if(attacker) attacker.energy=Math.min(100,attacker.energy+20);
}
function damagePillars(x,y,z,dmg,attacker){
  for(const p of pillars){
    if(!p.alive) continue;
    const d=Math.hypot(x-p.x, z-p.z);
    if(d<2.0){
      p.hp-=dmg; p.wobble=1;
      burst(p.x,Math.min(y,3),p.z,0xd1d5db);
      sfx('stone');
      p.mat.color.setHex(p.hp<20?0x6b7280:0x9aa3ad);
      if(p.hp<=0) destroyPillar(p,attacker);
    }
  }
}
function updatePillars(dt){
  const t=performance.now()*.001;
  for(const p of pillars){
    if(!p.alive) continue;
    p.wobble=Math.max(0,p.wobble-dt*2.5);
    const tilt=(1-p.hp/p.maxHp)*.14;   // se inclina al dañarse
    p.group.rotation.z=tilt+Math.sin(t*28)*.07*p.wobble;
    p.group.rotation.x=Math.cos(t*24)*.05*p.wobble;
    p.crystal.rotation.y=t*2; p.crystal.position.y=4.05+Math.sin(t*3)*.07;
    p.crystal.material.emissiveIntensity=1.6+Math.sin(t*4)*.8;
  }
}
function collidePillars(f){
  for(const p of pillars){
    if(!p.alive) continue;
    const dx=f.pos.x-p.x, dz=f.pos.z-p.z, d=Math.hypot(dx,dz);
    if(d>0.001 && d<1.05){ f.pos.x=p.x+dx/d*1.05; f.pos.z=p.z+dz/d*1.05; }
  }
}
// Hook de pruebas/debug (no afecta el juego)
window.__pillars=pillars; window.__damagePillars=damagePillars;

function makeRobot(color, accent){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color, metalness:.8, roughness:.25});
  const dark=new THREE.MeshStandardMaterial({color:0x111827, metalness:.6, roughness:.4});
  const glow=new THREE.MeshStandardMaterial({color:accent, emissive:accent, emissiveIntensity:2.4});
  const steel=new THREE.MeshStandardMaterial({color:0x94a3b8, metalness:.95, roughness:.15});

  // Torso tipo cápsula + cinturón + núcleo de energía en el pecho
  const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.52,.55,6,16),mat); torso.position.y=1.28; torso.castShadow=true; g.add(torso);
  const belt=new THREE.Mesh(new THREE.CylinderGeometry(.48,.56,.2,16),dark); belt.position.y=.92; g.add(belt);
  const core=new THREE.Mesh(new THREE.SphereGeometry(.16,14,12),glow); core.position.set(0,1.45,.4); g.add(core);
  const coreRing=new THREE.Mesh(new THREE.TorusGeometry(.24,.035,10,24),steel); coreRing.position.copy(core.position); g.add(coreRing);

  // Cabeza esférica con visor curvo y antena
  const head=new THREE.Group(); head.position.y=2.08; g.add(head);
  const skull=new THREE.Mesh(new THREE.SphereGeometry(.34,18,16),mat); skull.castShadow=true; head.add(skull);
  const visor=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.1,16,1,true,Math.PI*1.15,Math.PI*.7),glow);
  visor.position.set(0,.02,0); visor.rotation.x=Math.PI/2; head.add(visor);
  const antenna=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,.34,6),steel); antenna.position.set(.2,.42,-.05); head.add(antenna);
  const antTip=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),glow); antTip.position.set(.2,.6,-.05); head.add(antTip);

  // Hombreras esféricas de acero
  const shL=new THREE.Mesh(new THREE.SphereGeometry(.21,14,12),steel); shL.position.set(-.68,1.6,0); g.add(shL);
  const shR=shL.clone(); shR.position.x=.68; g.add(shR);

  // Brazos: bíceps + codo + antebrazo + puño esférico
  const armL=new THREE.Group(); armL.position.set(-.68,1.6,0); g.add(armL);
  const armR=new THREE.Group(); armR.position.set(.68,1.6,0); g.add(armR);
  for(const arm of [armL,armR]){
    const bi=new THREE.Mesh(new THREE.CapsuleGeometry(.15,.26,4,12),mat); bi.position.y=-.28; bi.castShadow=true; arm.add(bi);
    const elbow=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10),steel); elbow.position.y=-.52; arm.add(elbow);
    const fore=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.28,4,12),mat); fore.position.y=-.75; arm.add(fore);
    const fist=new THREE.Mesh(new THREE.SphereGeometry(.19,12,10),dark); fist.position.y=-1.02; fist.castShadow=true; arm.add(fist);
  }

  // Piernas: cadera + muslo + rodilla + canilla + bota redondeada
  const legL=new THREE.Group(); legL.position.set(-.3,.9,0); g.add(legL);
  const legR=new THREE.Group(); legR.position.set(.3,.9,0); g.add(legR);
  for(const leg of [legL,legR]){
    const thigh=new THREE.Mesh(new THREE.CapsuleGeometry(.17,.3,4,12),dark); thigh.position.y=-.3; leg.add(thigh);
    const knee=new THREE.Mesh(new THREE.SphereGeometry(.14,12,10),steel); knee.position.y=-.58; leg.add(knee);
    const shin=new THREE.Mesh(new THREE.CapsuleGeometry(.15,.3,4,12),dark); shin.position.y=-.85; leg.add(shin);
    const foot=new THREE.Mesh(new THREE.SphereGeometry(.2,12,10),mat); foot.scale.set(1,.5,1.4); foot.position.set(0,-1.12,.1); foot.castShadow=true; leg.add(foot);
  }

  // Tanque de propelente (mochila)
  const tank=new THREE.Mesh(new THREE.CapsuleGeometry(.18,.3,6,10),steel); tank.position.set(0,1.4,-.42); g.add(tank);

  g.userData={armL,armR,legL,legR,head,torso};
  return g;
}

function makeSoldier(color, accent){
  const g=new THREE.Group();
  const skin=new THREE.MeshStandardMaterial({color:0xc98d5f, metalness:.05, roughness:.7});
  const mat=new THREE.MeshStandardMaterial({color, metalness:.25, roughness:.55});
  const dark=new THREE.MeshStandardMaterial({color:0x1c2b1c, metalness:.3, roughness:.6});
  const glow=new THREE.MeshStandardMaterial({color:accent, emissive:accent, emissiveIntensity:1.8});
  const black=new THREE.MeshStandardMaterial({color:0x0b0f0b, metalness:.4, roughness:.5});

  // Torso cápsula + chaleco táctico con placas
  const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.46,.5,6,16),skin); torso.position.y=1.28; torso.castShadow=true; g.add(torso);
  const vest=new THREE.Mesh(new THREE.CylinderGeometry(.55,.6,.55,14),dark); vest.position.y=1.32; g.add(vest);
  const pouchL=new THREE.Mesh(new THREE.BoxGeometry(.2,.14,.08),black); pouchL.position.set(-.22,1.18,.32); g.add(pouchL);
  const pouchR=pouchL.clone(); pouchR.position.x=.22; g.add(pouchR);
  const insignia=new THREE.Mesh(new THREE.SphereGeometry(.07,10,8),glow); insignia.position.set(0,1.5,.36); g.add(insignia);
  const belt=new THREE.Mesh(new THREE.CylinderGeometry(.5,.54,.14,14),black); belt.position.y=.95; g.add(belt);

  // Cabeza + casco redondo con visera
  const head=new THREE.Group(); head.position.y=1.98; g.add(head);
  const face=new THREE.Mesh(new THREE.SphereGeometry(.27,16,14),skin); head.add(face);
  const helmet=new THREE.Mesh(new THREE.SphereGeometry(.33,18,14,0,Math.PI*2,0,Math.PI*.62),mat); helmet.castShadow=true; head.add(helmet);
  const brim=new THREE.Mesh(new THREE.TorusGeometry(.28,.025,8,22),dark); brim.rotation.x=Math.PI/2; brim.position.y=.08; brim.scale.set(1.25,1,1); head.add(brim);
  const visor=new THREE.Mesh(new THREE.BoxGeometry(.32,.07,.05),glow); visor.position.set(0,.05,.24); head.add(visor);

  // Hombreras
  const shL=new THREE.Mesh(new THREE.SphereGeometry(.18,12,10),mat); shL.position.set(-.6,1.58,0); g.add(shL);
  const shR=shL.clone(); shR.position.x=.6; g.add(shR);

  // Brazos con codos
  const armL=new THREE.Group(); armL.position.set(-.6,1.58,0); g.add(armL);
  const armR=new THREE.Group(); armR.position.set(.6,1.58,0); g.add(armR);
  for(const arm of [armL,armR]){
    const bi=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.22,4,12),mat); bi.position.y=-.24; bi.castShadow=true; arm.add(bi);
    const elbow=new THREE.Mesh(new THREE.SphereGeometry(.11,10,8),dark); elbow.position.y=-.45; arm.add(elbow);
    const fore=new THREE.Mesh(new THREE.CapsuleGeometry(.11,.26,4,12),mat); fore.position.y=-.66; arm.add(fore);
    const fist=new THREE.Mesh(new THREE.SphereGeometry(.16,12,10),skin); fist.position.y=-.92; fist.castShadow=true; arm.add(fist);
  }

  // Rifle: cuerpo + cañón + mira + culata
  const rifle=new THREE.Group(); rifle.position.set(.08,-1.08,.18); armR.add(rifle);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.05,.06,.5,12),black); body.rotation.x=Math.PI/2; body.position.z=.1; rifle.add(body);
  const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.42,10),black); barrel.rotation.x=Math.PI/2; barrel.position.z=.5; rifle.add(barrel);
  const scope=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.2,8),dark); scope.rotation.x=Math.PI/2; scope.position.set(0,.09,.15); rifle.add(scope);
  const mag=new THREE.Mesh(new THREE.BoxGeometry(.06,.2,.08),black); mag.position.set(0,-.13,.1); rifle.add(mag);

  // Piernas con botas
  const legL=new THREE.Group(); legL.position.set(-.26,.9,0); g.add(legL);
  const legR=new THREE.Group(); legR.position.set(.26,.9,0); g.add(legR);
  for(const leg of [legL,legR]){
    const thigh=new THREE.Mesh(new THREE.CapsuleGeometry(.15,.28,4,12),dark); thigh.position.y=-.28; leg.add(thigh);
    const knee=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),black); knee.position.y=-.54; leg.add(knee);
    const shin=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.28,4,12),dark); shin.position.y=-.8; leg.add(shin);
    const boot=new THREE.Mesh(new THREE.SphereGeometry(.17,12,10),black); boot.scale.set(1,.55,1.45); boot.position.set(0,-1.05,.1); boot.castShadow=true; leg.add(boot);
  }

  // Mochila militar
  const pack=new THREE.Mesh(new THREE.CapsuleGeometry(.22,.34,6,10),mat); pack.position.set(0,1.35,-.48); g.add(pack);

  g.userData={armL,armR,legL,legR,head,torso, rifle};
  return g;
}

// Estado global de animaciones de impacto/KO
let shakeT=0, koState=null;
// Slow-motion cinematográfico (KO y lanzamientos aéreos): 1 = tiempo normal
let timeScale=1;

class Fighter{
  constructor(mesh, name, isAI){
    this.mesh=mesh; this.name=name; this.isAI=isAI;
    this.hp=100; this.energy=40; this.pos=mesh.position;
    this.vel=new THREE.Vector3(); this.facing=0;
    this.state='idle'; this.timer=0; this.cooldown=0; this.hurt=0;
    this.blocking=false; this.attackType=null;
    this.hurtTilt=0; this.kb=new THREE.Vector3(); this.walkPhase=0;
    // Combate aéreo (estilo launcher/juggle): air = víctima en vuelo, aerial = atacante rematando
    this.air=null; this.aerial=null;
    this.legendaryUntil=0; this.prevWeapon=null;
    // Adaptativa
    this.memory={closeAttacks:0, farAttacks:0, blocks:0, counters:0, hitsTaken:0, lastOppMove:0, aggression:.45, defense:.35, danger:0};
    // Personalidad de IA rival (seleccionable)
    this.persona='adaptativa';
    this.personaCfg={
      adaptativa:{ label:'🧠 ADAPTATIVA', aggr:.4, def:.35, speed:3.6, dmgBonus:1.0, desc:'Aprende de tu patrón' },
      agresiva:  { label:'🔥 AGRESIVA',   aggr:.92, def:.12, speed:4.6, dmgBonus:1.25, desc:'Ataca sin parar' },
      defensiva: { label:'🛡️ DEFENSIVA', aggr:.22, def:.92, speed:2.9, dmgBonus:0.9,  desc:'Bloquea y contraataca' },
      tramposa:  { label:'🎲 TRAMPOSA',   aggr:.6,  def:.5,  speed:3.8, dmgBonus:1.1,  desc:'Esquiva y te engaña' },
      grok:      { label:'🤪 GROK',       aggr:.86, def:.18, speed:4.8, dmgBonus:1.2,  desc:'Caos total, sin patrón' },
      chatgpt:   { label:'💬 CHATGPT',    aggr:.55, def:.55, speed:3.4, dmgBonus:1.05, desc:'Estratégico, analiza y responde' },
      claude:    { label:'🧭 CLAUDE',     aggr:.34, def:.82, speed:3.1, dmgBonus:0.95, desc:'Paciente, calcula tu error' },
      deepseek:  { label:'🔍 DEEPSEEK',   aggr:.5,  def:.6,  speed:3.5, dmgBonus:1.0,  desc:'Busca tu debilidad' }
    };
  }
  cfg(){ return this.personaCfg[this.persona] || this.personaCfg.adaptativa; }
  reset(x,z){ this.hp=(this.maxHp||100); this.energy=40; this.pos.set(x,.3,z); this.vel.set(0,0,0); this.state='idle'; this.timer=0; this.hurtTilt=0; this.kb.set(0,0,0); this.mesh.rotation.x=0; this.air=null; this.aerial=null; }
  hit(dmg, attacker, heavy){
    if(this.blocking && Math.random()<.75){ 
      if(attacker) attacker.memory.counters++;
      this.memory.blocks++; this.flash(0x93c5fd); showToast('¡BLOQUEO!'); this.energy=Math.min(100,this.energy+6); sfx('block'); return 0;
    }
    this.hp=Math.max(0,this.hp-dmg); this.hurt=.25; this.memory.hitsTaken++;
    this.hurtTilt=1;
    if(attacker){
      const d=this.pos.clone().sub(attacker.pos); d.y=0; d.normalize();
      this.kb.copy(d.multiplyScalar(heavy?6.5:4.5));   // empujón hacia atrás
    }
    if(heavy) shakeT=.55;
    this.flash(0xff4444); burst(this.pos.x,1.5,this.pos.z,0xffaa00);
    this.energy=Math.min(100,this.energy+4);
    showDmg(this.pos, dmg);
    return dmg;
  }
  flash(c){ this.mesh.traverse(o=>{ if(o.material && o.material.emissive){ o.material.emissive.setHex(c); setTimeout(()=>o.material.emissive.setHex(0x000000),90); }}); }
}

// ── Modelos glTF animados (de Blender o Tripo AI) ──────────────────────────
// Si existe assets/models/<kind>.glb lo usa con sus animaciones (Idle/Attack);
// si no, usa el modelo procedural de arriba. Sin .glb → respaldo automático.
const mixers=[];
const gltfPreloaded={robot:null, soldier:null, volt:null, ninja:null, samurai:null, gladiator:null};
const gltfLoader=new GLTFLoader();
function gltfFindNode(mesh, ...names){
  let found=null;
  mesh.traverse(o=>{
    if(found) return;
    const n=(o.name||'').toLowerCase();
    if(names.some(s=>n.includes(s))) found=o;
  });
  return found;
}
function applyGltf(mesh){
  mesh.traverse(o=>{ if(o.isMesh){ o.castShadow=true; if(o.material) o.material.needsUpdate=true; } });
  const find=gltfFindNode.bind(null, mesh);
  mesh.userData.isGltf=true;
  mesh.userData.armL=find('arm_l','arml','leftarm','upperarmleft','upper_arm_l','l_upperarm','l_forearm')||new THREE.Group();
  mesh.userData.armR=find('arm_r','armr','rightarm','upperarmright','upper_arm_r','r_upperarm','r_forearm')||new THREE.Group();
  mesh.userData.legL=find('leg_l','legl','leftleg','thighleft','thigh_l','l_thigh','l_shin')||new THREE.Group();
  mesh.userData.legR=find('leg_r','legr','rightleg','thighright','thigh_r','r_thigh','r_shin')||new THREE.Group();
  mesh.userData.head=find('head','helmet','visor')||new THREE.Group();
  mesh.userData.torso=mesh;
  return mesh;
}
function preloadGltf(path, kind){
  return new Promise(resolve=>{
    gltfLoader.load(path, gltf=>{
      const mesh=applyGltf(gltf.scene);
      const mixer=new THREE.AnimationMixer(mesh);
      const idle=THREE.AnimationClip.findByName(gltf.animations,'Idle') || gltf.animations.find(c=>/idle|stand/i.test(c.name)) || gltf.animations[0];
      const attack=gltf.animations.find(c=>/attack|punch|jab|hit/i.test(c.name));
      if(idle){ mixer.clipAction(idle).play(); }
      mesh.userData.mixer=mixer; mesh.userData.attackClip=attack||null; mesh.userData.idleClip=idle||null; mesh.userData.clips=gltf.animations;
      mixers.push(mixer);
      gltfPreloaded[kind]=mesh;
      if(typeof trySwap==='function') trySwap(kind);   // el modelo llegó → reemplazar en juego
      resolve(true);
    }, undefined, ()=>resolve(false)); // sin archivo → respaldo procedural
  });
}

// Usa la primera instancia cargada del modelo que no esté en escena
function baseKind(kind){ return kind.replace(/_b$/,''); }
function spawnGltf(kind, pos){
  for(const k of [kind, kind+'_b']){
    const src=gltfPreloaded[k];
    if(src && src.parent!==scene){ src.position.copy(pos); src.rotation.x=0; scene.add(src); return src; }
  }
  return null;
}
function swapP1(kind){
  const c=CHARS[kind]||CHARS.robot;
  if(p1.kind===kind && p1.mesh && p1.mesh.userData.isGltf) return; // ya está con este modelo
  p1.kind=kind;
  const pos=p1.pos.clone();
  scene.remove(p1.mesh);
  let mesh=spawnGltf(kind,pos);
  if(mesh){ showToast('🤖 MODELO 3D CARGADO: '+c.short); }
  else { mesh=c.fallback(); mesh.position.copy(pos); scene.add(mesh); }
  p1.mesh=mesh; p1.pos=mesh.position;
  p1.maxHp=c.hp; p1.hp=c.hp;
  p1.speedMul=c.speed;
  p1.name=c.label;
  document.getElementById('youName').textContent=c.label;
  document.querySelector('#youTag').textContent=c.short+' · TÚ';
  attachWeapon(p1);
}

    const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.058,.068,.5,10),steel); barrel.position.y=.6; g.add(barrel);
    const cell=new THREE.Mesh(new THREE.SphereGeometry(.09,10,10),glow); cell.position.y=.3; g.add(cell);
  } else if(key==='fuego'){
    const blade=new THREE.Mesh(new THREE.CylinderGeometry(.06,.075,1.0,10), new THREE.MeshStandardMaterial({color:0xff6600, emissive:0xff4500, emissiveIntensity:3})); blade.position.y=.75; g.add(blade);
    const tip=new THREE.Mesh(new THREE.ConeGeometry(.095,.28,10), new THREE.MeshStandardMaterial({color:0xfacc15, emissive:0xff9500, emissiveIntensity:3.4})); tip.position.y=1.36; g.add(tip);
    const guard=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.05,12),steel); guard.position.y=.23; g.add(guard);

    const cap=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),steel); cap.position.y=1.18; g.add(cap);

function attachWeapon(f){
  if(f.weaponMesh && f.weaponMesh.parent){ f.weaponMesh.parent.remove(f.weaponMesh); f.weaponMesh=null; }
  const w=weaponOf(f);
  const g=buildWeaponMesh(w.key);
  if(f.mesh.userData.isGltf){
    const b=f.mesh.userData.armR;
    const len=typeof b.length==='function'?b.length():.65;
    g.position.set(0,len*1.05,0);
    g.scale.setScalar(Math.max(.35,len*1.15));
    b.add(g);
  } else {
    g.position.set(0,-1.02,.16);
    g.rotation.x=Math.PI/2;
    f.mesh.userData.armR.add(g);
  }
  f.weaponMesh=g;
}

function spawnPlasma(f,type){
  const dir=new THREE.Vector3(Math.sin(f.facing),0,Math.cos(f.facing));
  const m=new THREE.Mesh(projGeo,plasmaMat.clone());
  if(type==='special') m.scale.setScalar(1.8);

  m.userData={v:dir.multiplyScalar(14), dmg:type==='special'?26:(type==='kick'?17:12), owner:f, life:2.5};
  scene.add(m); projectiles.push(m);
  burst(f.pos.x+dir.x*.8,1.4,f.pos.z+dir.z*.8,0x22d3ee);
}

// ── Sonidos (Web Audio API, sin archivos externos) ────────────────────────
let audioCtx=null;
function sfx(kind){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const t=audioCtx.currentTime;
    const gain=audioCtx.createGain(); gain.connect(audioCtx.destination);
    const noise=(dur,freq,type,vol)=>{
      const b=audioCtx.createBuffer(1,Math.floor(audioCtx.sampleRate*dur),audioCtx.sampleRate);
      const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
      const s=audioCtx.createBufferSource(); s.buffer=b;
      const f=audioCtx.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=freq; f.Q.value=1;
      const g2=audioCtx.createGain(); g2.gain.setValueAtTime(vol||.3,t); g2.gain.exponentialRampToValueAtTime(.001,t+dur);
      s.connect(f); f.connect(g2); g2.connect(audioCtx.destination); s.start(t); s.stop(t+dur+.02);
    };
    const tone=(type,f0,f1,dur,vol)=>{
      const o=audioCtx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f0,t);
      if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
      o.connect(gain); gain.gain.setValueAtTime(vol||.25,t); gain.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.start(t); o.stop(t+dur+.02);
    };
    switch(kind){
      case 'punch': tone('sine',150,70,.12,.3); noise(.06,900,'lowpass',.22); break;
      case 'kick': tone('sine',110,55,.16,.35); noise(.07,600,'lowpass',.28); break;
      case 'sword': tone('square',720,180,.17,.22); noise(.17,2400,'highpass',.18); break;
      case 'hammer': tone('sine',95,42,.34,.45); noise(.15,520,'lowpass',.3); break;
      case 'nunchaku': tone('triangle',1500,1100,.06,.25); setTimeout(()=>sfx('punch'),70); break;
      case 'spear': noise(.12,1800,'bandpass',.22); tone('triangle',900,600,.1,.18); break;
      case 'plasma': tone('sawtooth',880,240,.2,.3); noise(.09,1500,'highpass',.14); break;
      case 'block': tone('triangle',1250,1250,.1,.22); break;
      case 'special': tone('sawtooth',180,760,.4,.3); break;
      case 'combo': tone('square',600,880,.09,.18); break;
      case 'launcher': tone('sine',160,850,.3,.3); noise(.18,900,'bandpass',.15); break;
      case 'slam': tone('sine',120,35,.24,.4); noise(.2,420,'lowpass',.32); break;
      case 'stone': noise(.08,700,'lowpass',.3); tone('triangle',300,140,.07,.15); break;
      case 'legendary': [523,659,784,1047].forEach((n,i)=>setTimeout(()=>{
        try{
          const o=audioCtx.createOscillator(), g=audioCtx.createGain();
          o.type='square'; o.frequency.value=n; o.connect(g); g.connect(audioCtx.destination);
          const tt=audioCtx.currentTime; g.gain.setValueAtTime(.2,tt); g.gain.exponentialRampToValueAtTime(.001,tt+.16);
          o.start(tt); o.stop(tt+.18);
        }catch(e){}
      }, i*90)); break;
    }
  }catch(e){ /* sin audio */ }
}

p1.combo=0; p2.combo=0; p1.comboTimer=0; p2.comboTimer=0;
p1.legendaryUntil=0; p2.legendaryUntil=0; p1.prevWeapon=null; p2.prevWeapon=null;
function comboBonus(f){ return (f.combo||0)>=3 ? (f===p2 ? 1.15 : 1.35) : 1; }
function registerHit(f, dealt){
  if(dealt>0){
    f.combo=(f.combo||0)+1; f.comboTimer=2.2;
    if(f.combo>=3){ showToast('¡COMBO x'+f.combo+'! '+(f===p2?'(IA +15%)':'🔥 daño +35%')); sfx('combo'); }
  } else { f.combo=0; }
}
function decayCombo(dt){
  for(const f of [p1,p2]){
    if(f.comboTimer>0){ f.comboTimer-=dt; if(f.comboTimer<=0) f.combo=0; }
  }
}

  const beam=new THREE.Mesh(new THREE.CylinderGeometry(.28,1.1,10,8,1,true), new THREE.MeshBasicMaterial({color:t.color, transparent:true, opacity:.3, side:THREE.DoubleSide}));

  const light=new THREE.PointLight(t.color, 12, 7); light.position.y=1.6; g.add(light);
  // aparece algo alejada del centro pero dentro del encuadre de cámara
  if(new URLSearchParams(location.search).get('legendarydemo')){ g.position.set(2.3,0,1.2); }
  else { const a=Math.random()*Math.PI*2; g.position.set(Math.cos(a)*3.2, 0, Math.sin(a)*3.2); }
  scene.add(g);
  legendaryState={mesh:g, t, age:0};
  showToast('¡ARMA LEGENDARIA está en la arena! 🐉');
}
function pickLegendary(f){
  const t=legendaryState.t;
  scene.remove(legendaryState.mesh);
  legendaryState=null;
  legendaryClock=26;
  f.prevWeapon=f.weapon||WEAPONS.fists;
  f.weapon=WEAPONS[t.weapon];
  f.legendaryUntil=22;
  attachWeapon(f);
  showToast('¡'+t.label+'! 🔥 daño legendario');
  sfx('legendary');
}
function updateLegendary(dt){
  legendaryClock-=dt;
  if(legendaryClock<=0){ legendaryClock=24; spawnLegendary(); }
  if(!legendaryState) return;
  const m=legendaryState.mesh;
  legendaryState.age+=dt;
  m.rotation.y+=dt*1.6;
  m.position.y=Math.sin(performance.now()*.0022)*.15;
  if(legendaryState.age>1.5){ // período de gracia: todos la ven antes de que alguien la tome
    for(const f of [p1,p2]){
      if(Math.hypot(f.pos.x-m.position.x, f.pos.z-m.position.z)<legendaryPickupR){ pickLegendary(f); break; }
    }
  }
}
function revertLegendary(f){
  if(f.legendaryUntil>0 || f.prevWeapon){
    f.weapon=f.prevWeapon||WEAPONS.fists; f.prevWeapon=null; f.legendaryUntil=0;
    attachWeapon(f);
  }
}
function updateLegendaryTimers(dt){
  for(const f of [p1,p2]){
    if(f.legendaryUntil>0){
      f.legendaryUntil-=dt;
      if(f.legendaryUntil<=0){
        f.weapon=f.prevWeapon||WEAPONS.fists; f.prevWeapon=null; attachWeapon(f);

    }
  }
}

function tryAttack(f,type){
  if(roundOver||f.cooldown>0||f.hurt>0||f.air) return;
  if(type==='special' && f.energy<35){ showToast('Necesitas 35⚡'); return; }
  const w=weaponOf(f);
  if(type==='launcher' && w.kind==='ranged'){ /* armas a distancia no lanzan: atacan normal */ type='punch'; }
  f.state='attack'; f.timer=.32; f.attackType=type;
  if(f.mesh.userData.attackClip && f.mesh.userData.mixer){
    const a=f.mesh.userData.mixer.clipAction(f.mesh.userData.attackClip);
    a.reset(); a.setLoop(THREE.LoopOnce,1); a.clampWhenFinished=true; a.play();
  }
  f.cooldown = (type==='special'?.9:(type==='launcher'?.7:(type==='kick'?.55:.38))) * w.cd;
  if(type==='special') f.energy-=35;
  const target = f===p1?p2:p1;
  // Adaptive memory: tracks opponent patterns
  if(f===p1){
    if(dist(p1,p2)<3.2) p2.memory.closeAttacks++;
    else p2.memory.farAttacks++;
  }
  // Arma a distancia: dispara un proyectil de plasma
  if(w.kind==='ranged'){
    setTimeout(()=>{ if(!roundOver){ spawnPlasma(f,type); sfx(type==='special'?'special':'plasma'); } },120);
    return;
  }
  setTimeout(()=>{
    if(roundOver) return;
    if(dist(f,target)<w.range){
      let dmg = type==='special'?22:(type==='launcher'?11:(type==='kick'?14:9));
      if(f===p2) dmg=Math.round(dmg*(0.85+p2.memory.aggression*.4)*p2.cfg().dmgBonus);
      dmg=Math.round(dmg*w.dmg*comboBonus(f));
      const dealt=target.hit(dmg,f,type==='special'||w.key==='hammer');
      registerHit(f,dealt);
      damagePillars(target.pos.x,1.5,target.pos.z, dmg*1.4, f); // salpicadura al entorno
      if(dealt>0){
        if(type==='special') sfx('special');
        else if(type==='launcher') sfx('launcher');
        else if(type==='kick') sfx('kick');
        else sfx(w.key==='fists'?'punch':w.key);
      }
      if(type==='special') burst(target.pos.x,1.4,target.pos.z,0xa78bfa);
      // ── LAUNCHER (estilo ENENRA): si el golpe aéreo conecta, el rival sale volando ──
      if(type==='launcher' && dealt>0 && !target.air && target.hp>0){
        target.air={vy:6.8}; target.blocking=false; target.state='air';
        f.aerial={victim:target, hits:3, next:.4};
        burst(target.pos.x,.8,target.pos.z,0x38bdf8);
        shakeT=.4; timeScale=.45;   // mini slow-motion en el lanzamiento
        showToast(target===p1 ? '🚀 ¡'+f.name+' te lanzó al aire!' : '🚀 ¡RIVAL LANZADO! Sigue el combo aéreo');
      }
      // Tramposa: a veces esquiva por completo el primer golpe
      if(f===p1 && p2.persona==='tramposa' && Math.random()<0.18){
        p2.pos.x += (Math.random()<.5?-1.2:1.2); clampArena(p2);
        showToast('¡'+p2.name+' te esquivó! 🎲');
      }
      // Grok también esquiva a veces, pero por caos
      if(f===p1 && p2.persona==='grok' && Math.random()<0.12){
        p2.pos.x += (Math.random()<.5?-1:1); clampArena(p2);
        showToast('¡Grok se movió por caos! 🤪');
      }
      if(target.hp<=0) endRound(f);
    }
  },140);
}

function adaptiveBrain(dt){
  // La IA aprende según su personalidad: si el jugador ataca mucho de cerca → sube defensa; si se aleja → persigue más
  const m=p2.memory;
  const cfg=p2.cfg();
  const learnedDef = Math.min(.9, cfg.def + m.closeAttacks*.03 + m.blocks*.02);
  const learnedAggr = Math.min(.95, cfg.aggr + (m.farAttacks> m.closeAttacks? .08:0) + (100-p2.hp)*.002);
  if(p2.persona==='adaptativa'){
    m.defense=learnedDef; m.aggression=learnedAggr;
  } else if(p2.persona==='agresiva'){
    m.defense=.12; m.aggression=.92;
  } else if(p2.persona==='defensiva'){
    m.defense=.92; m.aggression=.22;
  } else if(p2.persona==='tramposa'){
    // Tramposa alterna entre presionar y huir para engañar, influida por su memoria
    m.defense=.5; m.aggression=.6 + (Math.random()<.02 ? (Math.random()-.5)*.4 : 0);
  } else if(p2.persona==='grok'){
    // Grok: caos total, ignora memoria — hace movimientos impredecibles, ataca aunque esté lejos, a veces se queda quieto
    m.defense=Math.random()*.5; m.aggression=.86;
  } else if(p2.persona==='chatgpt'){
    // ChatGPT: estratégico equilibrado, analiza distancia y usa especial cuando tiene energía
    m.defense=Math.min(.9, .55 + (m.closeAttacks>6 ? .2 : 0));
    m.aggression=.55 + (p2.energy>70 ? .25 : 0);
  } else if(p2.persona==='claude'){
    // Claude: paciente y defensiva, deja que te canses  (espera y contraataca)
    m.defense=.82; m.aggression=.34 + (p1.hp < p2.hp ? .15 : 0);
  } else if(p2.persona==='deepseek'){
    // DeepSeek: busca debilidad — si atacas mucho de cerca, persigue y usa patada; si huyes, carga especial
    m.defense=Math.min(.9, .6 + m.closeAttacks*.02);
    m.aggression=.5 + (m.farAttacks > m.closeAttacks ? .25 : 0);
  }
  m.danger += (p1.state==='attack'?1:0)*dt;

  if(p2.hurt>0||p2.air||p2.aerial||roundOver) return;
  const d=dist(p1,p2);
  faceTo(p2,p1);
  p2.timer-=dt; p2.cooldown-=dt;
  if(p2.state==='attack'&&p2.timer>0) return;
  if(p2.state==='attack') p2.state='idle';

  // Decisión con memoria + personalidad
  const r=Math.random();
  const speed=cfg.speed;
  // Frases según personalidad
  if(Math.random()<.012){
    const phrases={
      grok:['¡JA! 🤪','¿Eso es todo?','¡Mi caos te gana!','Jeee, predecible no soy'],
      chatgpt:['Analizando... 💬','Estrategia calculada ✔','Respuesta óptima','Calibrando ataque'],
      claude:['Con calma... 🧭','El truco es la paciencia','Calculé ese golpe','Ahora sí, mi turno'],
      deepseek:['Buscando patrón... 🔍','Tu debilidad: cerca','Copiando tu estilo','Detectada tu falla'],
      tramposa:['¿Me viste? 🎲','Truco aprendido','Casi me atrapas']
    };
    const arr=phrases[p2.persona] || phrases.tramposa;
    if(arr) showToast(arr[Math.floor(Math.random()*arr.length)]);
  }
  if(p2.persona==='tramposa' && Math.random()<0.10){
    // Truco: esquiva lateral rápido y luego contraataca
    moveAI(Math.random()<.5?-2.2:2.2, -1, speed*dt);
    if(r<m.aggression*.8 && p2.cooldown<=0){ setTimeout(()=>{if(!roundOver){p2.blocking=false; tryAttack(p2,'special');}},180); }
  }
  else if(p2.persona==='grok' && Math.random()<0.20){
    // Grok hace giros locos sin importar la distancia
    moveAI(Math.random()<.5?-2:2, -1.5, speed*1.2*dt);
    if(Math.random()<.7 && p2.cooldown<=0){ const a=['punch','kick','special']; tryAttack(p2, a[Math.floor(Math.random()*3)]); }
  }
  else if(p2.persona==='claude' && d>3 && Math.random()<0.10){
    // Claude espera paciente, deja que te acerques
    // no attack, solo espera
  }
  else if(p2.persona==='chatgpt' && p2.energy>=35 && d<=5 && Math.random()<0.18){
    tryAttack(p2,'special'); // ChatGPT usa especial estratégico
  }
  else if(Math.random()<m.defense) { p2.blocking=true; p2.state='block'; p2.timer=.5+.4*m.defense; 
    if(r<m.aggression*.6 && p2.cooldown<=0){ setTimeout(()=>{if(!roundOver){p2.blocking=false; tryAttack(p2,'punch');}},220); }
  }
  else if(d>4.5){ moveAI(0,1,speed*dt); if(r<m.aggression) tryAttack(p2,'special'); }
  else if(d>2.6){ moveAI(0,1,speed*dt); if(r<m.aggression*.7) tryAttack(p2, Math.random()<.4?'kick':'punch'); }
  else { // cerca
    // La IA también lanza al aire y remata aéreo (estilo ENENRA)
    if(!p1.air && r<m.aggression*.28 && p1.hp>0){ tryAttack(p2,'launcher'); }
    else if(r<m.aggression) tryAttack(p2, Math.random()<.5?'punch':'kick');
    else if(r<m.aggression+m.defense*.5){ p2.blocking=true; p2.state='block'; p2.timer=.4; }
    else moveAI(1,0,speed*.55*dt); // esquiva lateral
  }
  if(p2.state==='block'&&p2.timer<=0){p2.blocking=false;p2.state='idle';}
  p2.energy=Math.min(100,p2.energy+dt*3);
  document.getElementById('style1').textContent = cfg.label;
  document.getElementById('blockStat').textContent = Math.round(m.defense*100)+'%';
  document.getElementById('counterStat').textContent = m.counters;
}
function moveAI(x,z,speed){
  const fwd=new THREE.Vector3(Math.sin(p2.facing),0,Math.cos(p2.facing));
  const right=new THREE.Vector3(fwd.z,0,-fwd.x);
  p2.pos.addScaledVector(fwd,z*speed).addScaledVector(right,x*speed);
  clampArena(p2); collidePillars(p2);
}
function clampArena(f){ f.pos.x=THREE.MathUtils.clamp(f.pos.x,-7.5,7.5); f.pos.z=THREE.MathUtils.clamp(f.pos.z,-7.5,7.5); }

function playerUpdate(dt){
  p1.timer-=dt; p1.cooldown-=dt; if(p1.hurt>0)p1.hurt-=dt;
  if(p1.air||p1.aerial) return;   // en el aire no controlas (te lanzaron / combo aéreo)
  faceTo(p1,p2);
  let mx=0,mz=0;
  if(autoMode){
    // Ambos pelean solos cuando AUTO está ON (modo espectador IA vs IA)
    // Jugador actúa como segunda IA simple
    const d=dist(p1,p2);
    if(d>3) { mz=1; }
    else if(Math.random()<.03){ // AUTO también lanza aéreos a veces
      tryAttack(p1, Math.random()<.22?'launcher':(Math.random()<.5?'punch':'kick'));
    }
    if(d<2 && Math.random()<.01) mz=-.6;
  } else {
    if(keys['w']||keys['arrowup']) mz+=1; if(keys['s']||keys['arrowdown']) mz-=1;
    if(keys['a']||keys['arrowleft']) mx-=1; if(keys['d']||keys['arrowright']) mx+=1;
    mx+=joy.x; mz+=-joy.y;
    if(keys['j']) tryAttack(p1,'punch'); if(keys['k']) tryAttack(p1,'kick'); if(keys['l']) tryAttack(p1,'special');
    if(keys[' ']||keys['i']) tryAttack(p1,'launcher'); // 🚀 lanzamiento aéreo
  }
  const len=Math.hypot(mx,mz); if(len>1){mx/=len;mz/=len;}
  const fwd=new THREE.Vector3(Math.sin(p1.facing),0,Math.cos(p1.facing));
  const right=new THREE.Vector3(fwd.z,0,-fwd.x);
  p1.pos.addScaledVector(fwd,mz*3.6*p1.speedMul*dt).addScaledVector(right,mx*3.6*p1.speedMul*dt);
  clampArena(p1); collidePillars(p1);
  p1.energy=Math.min(100,p1.energy+dt*3);
  // animación brazos (solo para modelos procedurales — los glTF usan sus clips)
  const u=p1.mesh.userData;
  if(!u.isGltf){
    if(p1.state==='attack'&&p1.timer>0){ u.armR.rotation.x=-1.6; if(p1.attackType==='kick') u.legR.rotation.x=-1.2; }
    else { u.armR.rotation.x=0; u.legR.rotation.x=0; }
    if(p1.blocking){ u.armL.rotation.x=-.9; u.armR.rotation.x=-.9; }
  }
}

function aiAnim(dt){
  p2.timer-=dt; p2.cooldown-=dt; if(p2.hurt>0)p2.hurt-=dt;
  const u=p2.mesh.userData;
  if(!u.isGltf){
    if(p2.state==='attack'&&p2.timer>0){ u.armR.rotation.x=-1.6; if(p2.attackType==='kick') u.legR.rotation.x=-1.2; }
    else { u.armR.rotation.x=0; u.legR.rotation.x=0; }
    if(p2.blocking){ u.armL.rotation.x=-.9; u.armR.rotation.x=-.9; }
  }
  if(!p2.air&&!p2.aerial&&p2.pos.y<=.32) p2.mesh.position.y = .3 + Math.sin(performance.now()*.006)*.04;
  if(!p1.air&&!p1.aerial&&p1.pos.y<=.32) p1.mesh.position.y = .3 + Math.sin(performance.now()*.006+2)*.04;
}

function updateWalkAnim(dt){
  for(const f of [p1,p2]){
    const u=f.mesh.userData;
    const last=f._lastPos||f.pos.clone();
    const d=f.pos.distanceTo(last);
    f._lastPos=f.pos.clone();
    const speed=d/Math.max(dt,.001);
    if(f.state==='attack'&&f.timer>0){
      // en ataque respeta la pose de ataque
    } else if(speed>.5){
      f.walkPhase=(f.walkPhase||0)+dt*speed*2.1;
      const s=Math.sin(f.walkPhase)*.65;
      u.legL.rotation.x=s; u.legR.rotation.x=-s;
      if(u.isGltf){ u.armL.rotation.x=-s*.55; u.armR.rotation.x=s*.55; }
    } else {
      const k=Math.pow(.02,dt);
      u.legL.rotation.x*=k; u.legR.rotation.x*=k;
      if(u.isGltf){ u.armL.rotation.x*=k; u.armR.rotation.x*=k; }
    }
    // reacción al impacto: inclinar hacia atrás + empujón que se desvanece
    f.hurtTilt=Math.max(0,(f.hurtTilt||0)-dt*2.2);
    if(!f.air && (!koState||koState.loser!==f)){
      f.mesh.rotation.x=-f.hurtTilt*.4;
      if(f.kb.lengthSq()>0.01){
        f.pos.addScaledVector(f.kb,dt);
        f.kb.multiplyScalar(Math.exp(-5*dt));
        clampArena(f);
      }
    }
  }
}
function updateKo(dt){
  if(!koState) return;
  koState.t+=dt;
  const {loser, winner}=koState;
  if(loser.air){ /* el KO en pausa aérea: lo maneja updateAereo hasta tocar suelo */ }
  else{
    const p=Math.min(1, koState.t*1.8);
    loser.mesh.rotation.x=-p*1.5;                 // cae hacia atrás y se hunde
    loser.mesh.position.y=.3-p*.3;
  }
  const hop=Math.abs(Math.sin(koState.t*7))*.55*Math.max(0,1-koState.t/2.5);
  winner.mesh.position.y=.3+hop;                // salta de celebración
}

// ── Combate aéreo estilo ENENRA: juggle del atacante + física de vuelo ──────
function updateAereo(dt){
  for(const f of [p1,p2]){
    // Física de la víctima en el aire
    if(f.air){
      f.air.vy-=15*dt;
      f.pos.y+=f.air.vy*dt;
      f.mesh.rotation.x=THREE.MathUtils.clamp(-f.air.vy*.07,-1.05,.55); // vuelve en el aire
      if(f.pos.y<=.3){ // aterrizaje: slam con polvo (puede resquebrajar pilares cercanos)
        f.pos.y=.3; f.mesh.rotation.x=0; f.air=null; f.state='idle';
        burst(f.pos.x,.4,f.pos.z,0x94a3b8); shakeT=.4; sfx('slam');
        damagePillars(f.pos.x,.4,f.pos.z, 20, null);
      }
    }
    // Regreso suave del atacante tras terminar el combo aéreo
    if(!f.air&&!f.aerial&&f.pos.y>.32){
      f.pos.y=Math.max(.3, f.pos.y-4.5*dt);
      if(f.pos.y<=.32) f.pos.y=.3;
    }
    // Ataques aéreos del atacante (juggle)
    if(f.aerial){
      const a=f.aerial, v=a.victim;
      if(roundOver||v.hp<=0||!v.air||a.hits<=0){ f.aerial=null; continue; }
      f.mesh.rotation.x=0;
      f.pos.y=.3+Math.max(.35, v.pos.y*.8-1);      // el atacante salta tras la víctima
      faceTo(f,v);
      if(a.t>=a.next){
        a.next+=.3; a.hits--;
        let dmg=Math.round(9*weaponOf(f).dmg*comboBonus(f)*(f===p2?(.85+p2.memory.aggression*.4)*p2.cfg().dmgBonus:1));
        const dealt=v.hit(dmg,f,false);
        registerHit(f,dealt);
        damagePillars(v.pos.x,v.pos.y,v.pos.z, dmg, f); // el juggle puede romper pilares cercanos
        if(v.air) v.air.vy=Math.max(v.air.vy,3.2); // el juggle lo mantiene volando
        burst(v.pos.x,v.pos.y+.7,v.pos.z,0xfbbf24);
        shakeT=.25; sfx('punch');
        if(v.hp<=0){ endRound(f); continue; }
      }
      a.t+=dt;
    }
  }
}
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const rdt=Math.min(.05,clock.getDelta());
  if(timeScale<1) timeScale=Math.min(1, timeScale+rdt*(koState?.8:1.9)); // slow-mo se recupera
  const dt=rdt*timeScale;
  for(const mx of mixers) mx.update(dt);   // animaciones glTF (Blender / Tripo AI)
  decayCombo(dt);
  updateLegendary(dt);
  updateLegendaryTimers(dt);
  const comboEl=document.getElementById('combo');
  if(p1.combo>=2) comboEl.textContent='🔥 x'+p1.combo;
  else if(autoMode && p2.combo>=2) comboEl.textContent='🔥 '+p2.name+' x'+p2.combo;
  else comboEl.textContent='';
  if(!roundOver){ playerUpdate(dt); adaptiveBrain(dt); aiAnim(dt); }
  updateWalkAnim(dt);
  updateAereo(dt);
  updatePillars(dt);
  updateKo(dt);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.userData.life-=dt*1.4; p.position.addScaledVector(p.userData.v,dt); p.userData.v.y-=6*dt;
    p.scale.setScalar(Math.max(.01,p.userData.life)); if(p.userData.life<=0){scene.remove(p); particles.splice(i,1);}
  }
  // Proyectiles de plasma
  for(let i=projectiles.length-1;i>=0;i--){
    const pr=projectiles[i];
    pr.position.addScaledVector(pr.userData.v,dt);
    pr.userData.life-=dt;
    pr.rotation.x+=dt*8;
    const target = pr.userData.owner===p1 ? p2 : p1;
    // El plasma también impacta contra los pilares
    let hitPillar=false;
    for(const p of pillars){ if(p.alive && Math.hypot(pr.position.x-p.x, pr.position.z-p.z)<0.85 && pr.position.y<4){ hitPillar=true; break; } }
    if(hitPillar){
      damagePillars(pr.position.x,pr.position.y,pr.position.z, Math.round(pr.userData.dmg*1.2), pr.userData.owner);
      burst(pr.position.x,pr.position.y,pr.position.z,0x22d3ee);
      scene.remove(pr); projectiles.splice(i,1);
      continue;
    }
    if(pr.position.distanceTo(target.pos.clone().setY(1.3))<1.05){
      const w=weaponOf(pr.userData.owner);
      let dmg=Math.round(pr.userData.dmg*w.dmg*comboBonus(pr.userData.owner));
      const dealt=target.hit(dmg,pr.userData.owner, pr.userData.dmg>=26);
      registerHit(pr.userData.owner,dealt);
      damagePillars(pr.position.x,1.4,pr.position.z, dmg, pr.userData.owner);
      sfx('plasma');
      burst(pr.position.x,1.4,pr.position.z,0x22d3ee);
      scene.remove(pr); projectiles.splice(i,1);
      if(target.hp<=0) endRound(pr.userData.owner);
      continue;
    }
    if(pr.userData.life<=0 || Math.hypot(pr.position.x,pr.position.z)>11){
      scene.remove(pr); projectiles.splice(i,1);
    }
  }
  p1.mesh.position.copy(p1.pos); p2.mesh.position.copy(p2.pos);
  // cámara sigue el punto medio
  const mid=new THREE.Vector3().addVectors(p1.pos,p2.pos).multiplyScalar(.5);
  camera.position.lerp(new THREE.Vector3(mid.x*.6,7,11),.06);
  if(shakeT>0){ // sacudida de cámara en golpes fuertes y KO
    shakeT-=dt;
    camera.position.x+=(Math.random()-.5)*shakeT*1.5;
    camera.position.y+=(Math.random()-.5)*shakeT*1.1;
  }
  camera.lookAt(mid.x, Math.max(1.2,(p1.pos.y+p2.pos.y)/2+.5), mid.z);
  document.getElementById('hp1').style.width=(p1.hp/(p1.maxHp||100)*100)+'%'; document.getElementById('hp1').className='fill hp'+(p1.hp/(p1.maxHp||100)<30?' low':'');
  document.getElementById('hp2').style.width=(p2.hp/(p2.maxHp||100)*100)+'%'; document.getElementById('hp2').className='fill hp'+(p2.hp/(p2.maxHp||100)<30?' low':'');
  document.getElementById('en1').style.width=p1.energy+'%'; document.getElementById('en2').style.width=p2.energy+'%';
  renderer.render(scene,camera);
}
loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
