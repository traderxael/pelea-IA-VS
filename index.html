<!DOCTYPE html>
<html lang="es">
<head>

<title>Robots Antiguos 3D - OpenAI vs Qwen vs Grok vs Gemini vs DeepSeek</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0a0e1a;color:#fff;overflow:hidden;user-select:none;touch-action:none}
  #c{position:fixed;inset:0;display:block}
  .hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;justify-content:space-between;pointer-events:none;z-index:5}
  /* UI Anime estilo MIGHTREYA (misma estructura, nuevo look) */
  .card{flex:1;background:linear-gradient(135deg,rgba(12,18,45,.88),rgba(40,8,60,.78));border:2px solid #fff;border-radius:6px;padding:10px;backdrop-filter:blur(6px);box-shadow:0 4px 0 rgba(0,0,0,.45),0 0 18px rgba(124,58,237,.35);transform:skewX(-4deg)}
  .card>*{transform:skewX(4deg)}
  .card.center{transform:none;clip-path:polygon(12% 0,88% 0,100% 100%,0 100%)}
  .name{font-weight:900;font-style:italic;font-size:15px;letter-spacing:.8px;text-transform:uppercase;text-shadow:2px 2px 0 #000,0 0 10px rgba(56,189,248,.6);display:flex;align-items:center;gap:7px}
  .portrait{font-size:24px;background:linear-gradient(135deg,#fbbf24,#ef4444);border:2px solid #fff;border-radius:50%;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 12px #f97316}
  .bar{height:16px;background:#0b1020;border-radius:3px;margin-top:6px;overflow:hidden;border:2px solid #fff;transform:skewX(-14deg);box-shadow:inset 0 2px 4px #000}
  .fill{height:100%;width:100%;transition:width .25s}
  .hp{background:linear-gradient(90deg,#fef08a 0%,#facc15 25%,#f97316 60%,#ef4444 100%)}
  .hp.low{background:linear-gradient(90deg,#ef4444,#991b1b)}
  .en{background:linear-gradient(90deg,#67e8f9,#22d3ee,#818cf8)} .enbar{height:9px}
  .center{text-align:center;min-width:92px}
  #timer{font-size:26px;font-weight:900;line-height:1}
  .tag{font-size:11px;opacity:.8}
  #banner{position:fixed;top:18%;width:100%;text-align:center;font-size:42px;font-weight:900;text-shadow:0 4px 20px #000;z-index:20;display:none}
  #toast{position:fixed;bottom:182px;width:100%;text-align:center;font-weight:700;text-shadow:0 2px 8px #000;z-index:10;pointer-events:none}
  .controls{position:fixed;left:0;right:0;bottom:0;height:170px;display:flex;justify-content:space-between;align-items:flex-end;padding:12px;z-index:6;pointer-events:none}
  #joyBase{width:126px;height:126px;border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.35);position:relative;pointer-events:auto}
  #joyKnob{width:58px;height:58px;border-radius:50%;background:#e2e8f0;position:absolute;left:34px;top:34px;box-shadow:0 4px 14px #000}
  .btns{display:grid;grid-template-columns:70px 70px 86px;gap:10px;pointer-events:auto}
  button{border:0;border-radius:50%;font-weight:900;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.35)}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .b1{width:70px;height:70px;background:#2563eb;font-size:22px}
  .b2{width:70px;height:70px;background:#dc2626;font-size:22px}
  .b4{width:86px;height:70px;background:#0284c7;font-size:15px}
  .b3{width:70px;height:70px;background:#7c3aed;font-size:18px;grid-column:span 3;width:100%}
  .topbtns{position:fixed;top:96px;left:10px;display:flex;gap:8px;z-index:7;flex-wrap:wrap;max-width:100vw}
  .topbtns button, .topbtns select{border-radius:99px;padding:10px 14px;background:#1e293b;border:1px solid #fff3;font-size:13px;color:#fff;box-shadow:none;outline:none}
  .topbtns select{background:#0f172a}
  .weaponbar{position:fixed;top:150px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:7;max-width:98vw;overflow-x:auto;padding:5px 7px;background:rgba(6,10,25,.65);border-radius:14px;border:1px solid #ffffff22}
  .wpn{background:#16213a;border:2px solid transparent;color:#dbeafe;border-radius:11px;padding:6px 9px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:none}
  .wpn.active{border-color:#fbbf24;background:#3a2505;box-shadow:0 0 16px #fbbf2466}
  .wpn.legendary{border-color:#facc15;background:#422006;box-shadow:0 0 18px #facc1599}
  #combo{position:fixed;top:206px;left:14px;z-index:7;font-size:38px;font-weight:900;font-style:italic;color:#fde047;text-shadow:3px 3px 0 #000,0 0 18px #f97316;letter-spacing:1px;pointer-events:none;transform:rotate(-4deg)}
  @keyframes rasendanPulse{0%,100%{box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 8px #67e8f9}50%{box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 26px #a78bfa,0 0 40px #67e8f9}}
  .b3{animation:rasendanPulse 1.4s infinite;border:2px solid #fff}
  #hint{text-align:center;font-size:12px;opacity:.85;margin-top:4px}
  /* [MK] overlays de FINISH HIM / victoria */
  #finishOverlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;background:radial-gradient(ellipse at center,rgba(60,0,0,.25),rgba(0,0,0,.72));pointer-events:none}
  #finishOverlay.on{display:flex}
  .finishTitle{font-size:56px;font-weight:900;font-style:italic;color:#fbbf24;text-shadow:0 0 24px #ef4444,3px 3px 0 #000;letter-spacing:3px;animation:finishPulse .5s infinite alternate}
  @keyframes finishPulse{from{transform:scale(1)}to{transform:scale(1.07)}}
  .finishSeq{display:flex;gap:18px;font-size:44px;margin-top:14px}
  .finishSeq span{filter:grayscale(1) opacity(.55);transition:filter .1s,transform .1s}
  .finishSeq span.done{filter:none;transform:scale(1.25)}
  .finishKeys{margin-top:8px;font-weight:900;font-size:18px;color:#e7e5e4;text-shadow:2px 2px 0 #000;letter-spacing:4px}
  #finishTimer{margin-top:10px;font-size:30px;font-weight:900;color:#ef4444;text-shadow:2px 2px 0 #000}
  #victoryOverlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:32;background:radial-gradient(ellipse at center,rgba(20,5,40,.55),rgba(0,0,0,.88))}
  #victoryOverlay.on{display:flex}
  #victoryFatality{display:none;font-size:64px;font-weight:900;font-style:italic;color:#ef4444;text-shadow:0 0 30px #b91c1c,4px 4px 0 #000;letter-spacing:4px;margin-bottom:8px}
  #victoryFatality.on{display:block;animation:finishPulse .4s infinite alternate}
  #victoryTitle{font-size:40px;font-weight:900;color:#fbbf24;text-shadow:3px 3px 0 #000}
  #victoryName{font-size:22px;font-weight:800;margin-top:6px;color:#e7e5e4;text-shadow:2px 2px 0 #000}
  #rematchBtn{margin-top:22px;border-radius:10px;padding:14px 34px;font-size:20px;background:linear-gradient(135deg,#b91c1c,#7f1d1d);border:2px solid #fbbf24;color:#fff;box-shadow:0 5px 0 #000,0 0 22px #b91c1c88;cursor:pointer}
  #rematchBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
  @media(min-width:800px){.controls{height:150px}}
</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e1a);
scene.fog = new THREE.Fog(0x0a0e1a, 18, 38);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 100);
camera.position.set(0,7,11);

scene.add(new THREE.HemisphereLight(0xbfd7ff,0x1a1030,1.2));
const sun = new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(6,12,6); sun.castShadow=true; scene.add(sun);
const rim = new THREE.PointLight(0x38bdf8,30,20); rim.position.set(-5,4,-4); scene.add(rim);

// Arena
const arena = new THREE.Group(); scene.add(arena);
const floor = new THREE.Mesh(new THREE.CylinderGeometry(9,9,.6,48), new THREE.MeshStandardMaterial({color:0x182544, metalness:.3, roughness:.6}));
floor.receiveShadow=true; arena.add(floor);
const ring = new THREE.Mesh(new THREE.RingGeometry(7.6,8.6,48), new THREE.MeshBasicMaterial({color:0x38bdf8, side:THREE.DoubleSide}));
ring.rotation.x=-Math.PI/2; ring.position.y=.32; arena.add(ring);
// ── Diseños de arena por ronda (rota cada ronda) ────────────────────────────
const ARENAS=[
  {name:'COLISEO ANTIGUO', icon:'🏛️', bg:0x0a0e1a, floor:0x182544, ring:0x38bdf8, crystal:0x22d3ee, deco:'columns'},
  {name:'DESIERTO DE PIRÁMIDES', icon:'🏜️', bg:0x2a1a05, floor:0xc2a35c, ring:0xf59e0b, crystal:0xfbbf24, deco:'pyramids'},
  {name:'VOLCÁN EN ERUPCIÓN', icon:'🌋', bg:0x1a0505, floor:0x3a1210, ring:0xff4500, crystal:0xff6600, deco:'rocks'},
  {name:'GLACIAR DE HIELO', icon:'❄️', bg:0x0a1a2a, floor:0x7fb8cc, ring:0x7dd3fc, crystal:0xa5f3fc, deco:'crystals'},
  {name:'CIUDAD NEÓN', icon:'🌃', bg:0x12041f, floor:0x1e1b3a, ring:0xe879f9, crystal:0xc084fc, deco:'neon'},
  {name:'SELVA ANCESTRAL', icon:'🌿', bg:0x051a0a, floor:0x14532d, ring:0x4ade80, crystal:0x86efac, deco:'trees'},
  {name:'COLISEO ROMANO', icon:'🏛️', bg:0x87b5d6, floor:0xd9b380, ring:0xdc2626, crystal:0xf59e0b, deco:'roman'},
  {name:'BASE LUNAR', icon:'🚀', bg:0x030712, floor:0x6b7280, ring:0xe5e7eb, crystal:0xffffff, deco:'space'},
  {name:'ISLA TROPICAL', icon:'🏝️', bg:0x0e7490, floor:0xfde68a, ring:0x14b8a6, crystal:0x2dd4bf, deco:'island'},
  {name:'CASTILLO MEDIEVAL', icon:'🏰', bg:0x1c1917, floor:0x78716c, ring:0xf97316, crystal:0xfb923c, deco:'castle'},
];
let arenaIdx=0, decoGroup=null;
function buildDeco(kind){
  const g=new THREE.Group();
  for(let i=0;i<10;i++){
    const a=i/10*Math.PI*2, x=Math.cos(a)*11, z=Math.sin(a)*11;
    const h=1.6+Math.random()*2.4;
    let m;
    if(kind==='columns'){
      const col=new THREE.Mesh(new THREE.CylinderGeometry(.32,.42,h,10), new THREE.MeshStandardMaterial({color:0x0f172a, metalness:.7, roughness:.35}));
      col.position.set(x,h/2,z); g.add(col);
      const cap=new THREE.Mesh(new THREE.SphereGeometry(.34,12,10), new THREE.MeshStandardMaterial({color:0x1d4ed8, emissive:0x3b82f6, emissiveIntensity:1.2}));
      cap.position.set(x,h+.3,z); g.add(cap);
      // Público en gradas del Coliseo (portado de rama pelea-coliseo-kiln, estático)
      const crowdCols=[0xef4444,0xf59e0b,0x22c55e,0x3b82f6,0xa855f7,0xec4899];
      for(let j=0;j<4;j++){
        const ca=(i*4+j)/40*Math.PI*2, R=14.5+((i+j)%3)*1.2, Y=3.2+((i+j)%3)*1.1;
        const p=new THREE.Group(); p.position.set(Math.cos(ca)*R,Y,Math.sin(ca)*R); p.lookAt(0,Y,0);
        const b=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.22,3,8), new THREE.MeshStandardMaterial({color:crowdCols[(i+j)%crowdCols.length], roughness:.8})); b.position.y=.28; p.add(b);
        const hd=new THREE.Mesh(new THREE.SphereGeometry(.13,8,8), new THREE.MeshStandardMaterial({color:0xf2c79b, roughness:.7})); hd.position.y=.62; p.add(hd);
        g.add(p);
      }
    } else if(kind==='pyramids'){
      m=new THREE.Mesh(new THREE.ConeGeometry(1.5,h+1,4), new THREE.MeshStandardMaterial({color:0xd9b96a, roughness:.9}));
      m.position.set(x,(h+1)/2,z); m.rotation.y=Math.PI/4; g.add(m);
    } else if(kind==='rocks'){
      m=new THREE.Mesh(new THREE.IcosahedronGeometry(1+Math.random()*.8,0), new THREE.MeshStandardMaterial({color:0x292524, roughness:1}));
      m.position.set(x,1,z); g.add(m);
      const ember=new THREE.Mesh(new THREE.SphereGeometry(.22,8,8), new THREE.MeshStandardMaterial({color:0xff6600, emissive:0xff4500, emissiveIntensity:3}));
      ember.position.set(x,2.2,z); g.add(ember);
    } else if(kind==='crystals'){
      m=new THREE.Mesh(new THREE.ConeGeometry(.6,h+1.4,6), new THREE.MeshStandardMaterial({color:0xbae6fd, emissive:0x38bdf8, emissiveIntensity:.7, roughness:.2}));
      m.position.set(x,(h+1.4)/2,z); g.add(m);
    } else if(kind==='neon'){
      const c=i%2?0xe879f9:0x22d3ee;
      m=new THREE.Mesh(new THREE.BoxGeometry(.7,h,.7), new THREE.MeshStandardMaterial({color:0x111827, emissive:c, emissiveIntensity:1.6}));
      m.position.set(x,h/2,z); g.add(m);
    } else if(kind==='roman'){
      const col=new THREE.Mesh(new THREE.CylinderGeometry(.4,.5,h,10), new THREE.MeshStandardMaterial({color:0xcbbfa8, roughness:.85}));
      col.position.set(x,h/2,z); g.add(col);
      const banner=new THREE.Mesh(new THREE.PlaneGeometry(.9,1.8), new THREE.MeshStandardMaterial({color:0x991b1b, side:THREE.DoubleSide}));
      banner.position.set(x*0.92,2.2,z*0.92); banner.lookAt(0,2.2,0); g.add(banner);
      const crowdCols=[0xef4444,0xf59e0b,0x22c55e,0x3b82f6];
      const p=new THREE.Group(); p.position.set(x*1.25,3.4,z*1.25); p.lookAt(0,3.4,0);
      const b=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.22,3,8), new THREE.MeshStandardMaterial({color:crowdCols[i%4], roughness:.8})); b.position.y=.28; p.add(b); g.add(p);
    } else if(kind==='space'){
      m=new THREE.Mesh(new THREE.OctahedronGeometry(.7+Math.random()*.5), new THREE.MeshStandardMaterial({color:0x9ca3af, emissive:0xe5e7eb, emissiveIntensity:.4, roughness:.4}));
      m.position.set(x,1.2,z); m.rotation.set(Math.random(),Math.random(),0); g.add(m);
      const star=new THREE.Mesh(new THREE.SphereGeometry(.18,8,8), new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xffffff, emissiveIntensity:3}));
      star.position.set(x,2.4,z); g.add(star);
    } else if(kind==='island'){
      const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.28,h*.55,8), new THREE.MeshStandardMaterial({color:0x92400e, roughness:1}));
      trunk.position.set(x,h*.28,z); trunk.rotation.z=.25; g.add(trunk);
      const top=new THREE.Mesh(new THREE.ConeGeometry(1.1,1.6,8), new THREE.MeshStandardMaterial({color:0x16a34a, roughness:.9}));
      top.position.set(x+.4,h*.55+.8,z); g.add(top);
      const rock=new THREE.Mesh(new THREE.IcosahedronGeometry(.5,0), new THREE.MeshStandardMaterial({color:0x78716c, roughness:1}));
      rock.position.set(x,0.5,z); g.add(rock);
    } else if(kind==='castle'){
      const tw=new THREE.Mesh(new THREE.BoxGeometry(1.2,h,1.2), new THREE.MeshStandardMaterial({color:0x78716c, roughness:.9}));
      tw.position.set(x,h/2,z); g.add(tw);
      const roof=new THREE.Mesh(new THREE.ConeGeometry(.9,1.2,4), new THREE.MeshStandardMaterial({color:0x7c2d12, roughness:.8}));
      roof.position.set(x,h+.6,z); roof.rotation.y=Math.PI/4; g.add(roof);
      const flame=new THREE.Mesh(new THREE.SphereGeometry(.16,8,8), new THREE.MeshStandardMaterial({color:0xf97316, emissive:0xf97316, emissiveIntensity:2.5}));
      flame.position.set(x,h+1.4,z); g.add(flame);
    } else { // trees
      const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,h*.6,8), new THREE.MeshStandardMaterial({color:0x4a2c14, roughness:1}));
      trunk.position.set(x,h*.3,z); g.add(trunk);
      const top=new THREE.Mesh(new THREE.SphereGeometry(1+Math.random()*.5,10,8), new THREE.MeshStandardMaterial({color:0x15803d, roughness:1}));
      top.position.set(x,h*.6+.8,z); g.add(top);
    }
  }
  return g;
}
function applyArena(i){
  const A=ARENAS[i%ARENAS.length]; arenaIdx=i%ARENAS.length;
  scene.background.set(A.bg); scene.fog.color.set(A.bg);
  floor.material.color.set(A.floor); ring.material.color.set(A.ring);
  rim.color.set(A.ring);
  for(const p of pillars){ p.crystal.material.color.set(A.crystal); p.crystal.material.emissive.set(A.crystal); }
  if(decoGroup) arena.remove(decoGroup);
  decoGroup=buildDeco(A.deco); arena.add(decoGroup);
  const tag=document.getElementById('arenaTag');
  if(tag) tag.textContent=A.icon+' '+A.name;
  window.__arena=A.name; window.__applyArena=applyArena;
}

const pillars=[];
function buildPillars(){
  const spots=[[-4.8,-2.6],[4.8,-2.6],[-4.8,2.6],[4.8,2.6]];
  for(const [x,z] of spots){
    const g=new THREE.Group();
    const mat=new THREE.MeshStandardMaterial({color:0x9aa3ad, metalness:.25, roughness:.8});
    const base=new THREE.Mesh(new THREE.BoxGeometry(1.4,.5,1.4),mat); base.position.y=.25; base.castShadow=true; g.add(base);
    const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.5,.62,2.8,8),mat); shaft.position.y=1.9; shaft.castShadow=true; g.add(shaft);
    const cap=new THREE.Mesh(new THREE.BoxGeometry(1.3,.45,1.3),mat); cap.position.y=3.5; cap.castShadow=true; g.add(cap);
    const crystal=new THREE.Mesh(new THREE.OctahedronGeometry(.24), new THREE.MeshStandardMaterial({color:0x22d3ee, emissive:0x22d3ee, emissiveIntensity:2.2}));
    crystal.position.y=4.05; g.add(crystal);
    g.position.set(x,.3,z);
    arena.add(g);
    pillars.push({group:g, mat, crystal, x, z, hp:32, maxHp:32, alive:true, wobble:0});
  }
}
buildPillars();
applyArena(0); // diseño inicial: Coliseo Antiguo
function resetPillars(){
  for(const p of pillars){
    p.hp=p.maxHp; p.alive=true; p.wobble=0;
    p.group.rotation.set(0,0,0); p.group.position.y=.3;
    p.mat.color.setHex(0x9aa3ad);
    if(p.group.parent!==arena) arena.add(p.group);
    p.group.visible=true;
  }
}
function destroyPillar(p, attacker){
  p.alive=false;
  arena.remove(p.group);
  burst(p.x,2,p.z,0x9aa3ad); burst(p.x,1,p.z,0x22d3ee); burst(p.x,3,p.z,0xfbbf24);
  shakeT=.55; sfx('slam');
  showToast('💥 ¡PILAR DESTRUIDO! '+(attacker?'+20⚡':''));
  if(attacker) attacker.energy=Math.min(100,attacker.energy+20);
}
function damagePillars(x,y,z,dmg,attacker){
  for(const p of pillars){
    if(!p.alive) continue;
    const d=Math.hypot(x-p.x, z-p.z);
    if(d<2.0){
      p.hp-=dmg; p.wobble=1;
      burst(p.x,Math.min(y,3),p.z,0xd1d5db);
      sfx('stone');
      p.mat.color.setHex(p.hp<20?0x6b7280:0x9aa3ad);
      if(p.hp<=0) destroyPillar(p,attacker);
    }
  }
}
function updatePillars(dt){
  const t=performance.now()*.001;
  for(const p of pillars){
    if(!p.alive) continue;
    p.wobble=Math.max(0,p.wobble-dt*2.5);
    const tilt=(1-p.hp/p.maxHp)*.14;   // se inclina al dañarse
    p.group.rotation.z=tilt+Math.sin(t*28)*.07*p.wobble;
    p.group.rotation.x=Math.cos(t*24)*.05*p.wobble;
    p.crystal.rotation.y=t*2; p.crystal.position.y=4.05+Math.sin(t*3)*.07;
    p.crystal.material.emissiveIntensity=1.6+Math.sin(t*4)*.8;
  }
}
function collidePillars(f){
  for(const p of pillars){
    if(!p.alive) continue;
    const dx=f.pos.x-p.x, dz=f.pos.z-p.z, d=Math.hypot(dx,dz);
    if(d>0.001 && d<1.05){ f.pos.x=p.x+dx/d*1.05; f.pos.z=p.z+dz/d*1.05; }
  }
}

function applyPickup(f, it){
  it.alive=false; it.respawnT=it.respawn; it.group.visible=false;
  burst(it.x,1.2,it.z, it.kind==='weapon'?0xfbbf24:(it.kind==='health'?0x34d399:(it.kind==='shield'?0x60a5fa:0xfacc15)));

  } else if(it.kind==='energy'){

function nearestPickup(){
  let best=null, bd=1e9;
  for(const it of pickups){ if(!it.alive) continue;
    const d=Math.hypot(p2.pos.x-it.x, p2.pos.z-it.z);
    if(d<bd){ bd=d; best=it; }
  }
  return best;
}
function updatePickups(dt){
  for(const it of pickups){
    if(!it.alive){
      it.respawnT-=dt;
      if(it.respawnT<=0){ it.alive=true; it.group.visible=true; }
      continue;
    }
    it.group.rotation.y+=dt*1.4;
    it.group.position.y=.3+Math.sin(performance.now()*.002+it.x)*.08;

    for(const f of [p1,p2]){
      if(f.air) continue;
      if(Math.hypot(f.pos.x-it.x, f.pos.z-it.z)<1.3){ applyPickup(f,it); break; }
    }
  }
}

// Estado global de animaciones de impacto/KO
let shakeT=0, koState=null;
// Slow-motion cinematográfico (KO y lanzamientos aéreos): 1 = tiempo normal
let timeScale=1;

class Fighter{
  constructor(mesh, name, isAI){
    this.mesh=mesh; this.name=name; this.isAI=isAI;
    this.hp=100; this.energy=40; this.pos=mesh.position;
    this.vel=new THREE.Vector3(); this.facing=0;
    this.state='idle'; this.timer=0; this.cooldown=0; this.hurt=0;
    this.blocking=false; this.attackType=null;
    this.hurtTilt=0; this.kb=new THREE.Vector3(); this.walkPhase=0;
    // [MK] estado de combate: move activo, ventanas, bloqueo, salto, knockdown
    this.move=null; this.moveName=null; this.attackT=0; this.attackHit=false;
    this.blockstun=0; this.invuln=0; this.jump=null; this.dash=null;
    this.knockdown=0; this.getup=0; this.lastBlocked=false; this._speed=0;
    // Combate aéreo (estilo launcher/juggle): air = víctima en vuelo, aerial = atacante rematando
    this.air=null; this.aerial=null;
    this.legendaryUntil=0; this.prevWeapon=null;
    this.shieldT=0; this.shieldMesh=null; // escudo de los objetos del ring
    // Adaptativa
    this.memory={closeAttacks:0, farAttacks:0, blocks:0, counters:0, hitsTaken:0, lastOppMove:0, aggression:.45, defense:.35, danger:0};
    // Personalidad de IA rival (seleccionable): OpenAI, Qwen, Grok, Gemini, DeepSeek
    this.persona='openai';
    this.personaCfg={
      openai:  { label:'🤖 OPENAI',   aggr:.55, def:.55, speed:3.4, dmgBonus:1.05, desc:'Estratégico, analiza y responde' },
      qwen:    { label:'⚡ QWEN',      aggr:.90, def:.25, speed:4.7, dmgBonus:1.15, desc:'Velocidad máxima, combos sin pausa' },
      grok:    { label:'🤪 GROK',      aggr:.86, def:.18, speed:4.8, dmgBonus:1.20, desc:'Caos total, sin patrón' },
      gemini:  { label:'💎 GEMINI',    aggr:.34, def:.82, speed:3.1, dmgBonus:0.95, desc:'Paciente, multimodal, contraataca' },
      deepseek:{ label:'🔍 DEEPSEEK',  aggr:.50, def:.60, speed:3.5, dmgBonus:1.00, desc:'Busca tu debilidad' }
    };
  }
  cfg(){ return this.personaCfg[this.persona] || this.personaCfg.openai; }
  reset(x,z){ this.hp=(this.maxHp||100); this.energy=40; this.pos.set(x,.3,z); this.vel.set(0,0,0); this.state='idle'; this.timer=0; this.hurtTilt=0; this.kb.set(0,0,0); this.mesh.rotation.x=0; this.air=null; this.aerial=null; this.shieldT=0; this.move=null; this.moveName=null; this.attackT=0; this.attackHit=false; this.blocking=false; this.blockstun=0; this.invuln=0; this.jump=null; this.dash=null; this.knockdown=0; this.getup=0; this.hurt=0; this.cooldown=0; if(this.shieldMesh){ this.shieldMesh.parent && this.shieldMesh.parent.remove(this.shieldMesh); this.shieldMesh=null; } }
  hit(dmg, attacker, heavy, noKb){
    this.lastBlocked=false;
    if(this.invuln>0) return 0;
    if(this.shieldT>0){
      this.flash(0x60a5fa); showToast('🛡️ ¡ESCUDO!'); this.energy=Math.min(100,this.energy+2); sfx('block'); return 0;
    }
    if(this.blocking){
      // [MK] bloqueo determinista: chip 20% + blockstun, sin RNG ni knockback
      const chip=Math.max(1,Math.round(dmg*.2));
      this.hp=Math.max(0,this.hp-chip);
      this.blockstun=.18; this.lastBlocked=true;
      if(attacker) attacker.memory.counters++;
      this.memory.blocks++; this.flash(0x93c5fd); showToast('🛡️ ¡BLOQUEO!'); this.energy=Math.min(100,this.energy+6); sfx('block');
      showDmg(this.pos, chip);
      return chip;
    }
    this.hp=Math.max(0,this.hp-dmg); this.hurt=.25; this.memory.hitsTaken++;
    this.hurtTilt=1;
    this.move=null; this.blocking=false;   // el impacto interrumpe tu ataque
    if(attacker && !noKb){
      const d=this.pos.clone().sub(attacker.pos); d.y=0; d.normalize();
      this.kb.copy(d.multiplyScalar(heavy?6.5:4.5));   // empujón hacia atrás (Rasendan: noKb = sin empuje)
    }
    if(heavy) shakeT=.55;
    this.flash(0xff4444); burst(this.pos.x,1.5,this.pos.z,0xffaa00);
    this.energy=Math.min(100,this.energy+4);
    showDmg(this.pos, dmg);
    return dmg;
  }
  flash(c){ this.mesh.traverse(o=>{ if(o.material && o.material.emissive){ o.material.emissive.setHex(c); setTimeout(()=>o.material.emissive.setHex(0x000000),90); }}); }
}

// Si existe assets/models/<kind>.glb lo usa con sus animaciones (Idle/Attack);
// si no, usa el modelo procedural de arriba. Sin .glb → respaldo automático.
const mixers=[];
const gltfPreloaded={robot:null, soldier:null, volt:null, ninja:null, samurai:null, gladiator:null, brute:null, vamp:null, ronin:null, rhino:null, panda:null, roja:null, ogro:null};
const gltfLoader=new GLTFLoader();
function gltfFindNode(mesh, ...names){
  let found=null;
  mesh.traverse(o=>{
    if(found) return;
    const n=(o.name||'').toLowerCase();
    if(names.some(s=>n.includes(s))) found=o;
  });
  return found;
}
function applyGltf(mesh){
  mesh.traverse(o=>{ if(o.isMesh){ o.castShadow=true; if(o.material) o.material.needsUpdate=true; } });
  const find=gltfFindNode.bind(null, mesh);
  mesh.userData.isGltf=true;
  mesh.userData.armL=find('arm_l','arml','leftarm','upperarmleft','upper_arm_l','l_upperarm','l_forearm')||new THREE.Group();
  mesh.userData.armR=find('arm_r','armr','rightarm','upperarmright','upper_arm_r','r_upperarm','r_forearm')||new THREE.Group();
  mesh.userData.legL=find('leg_l','legl','leftleg','thighleft','thigh_l','l_thigh','l_shin')||new THREE.Group();
  mesh.userData.legR=find('leg_r','legr','rightleg','thighright','thigh_r','r_thigh','r_shin')||new THREE.Group();
  mesh.userData.head=find('head','helmet','visor')||new THREE.Group();
  mesh.userData.torso=mesh;
  return mesh;
}
function preloadGltf(path, kind){
  return new Promise(resolve=>{
    gltfLoader.load(path, gltf=>{
      const mesh=applyGltf(gltf.scene);
      const mixer=new THREE.AnimationMixer(mesh);
      const idle=THREE.AnimationClip.findByName(gltf.animations,'Idle') || gltf.animations.find(c=>/idle|stand/i.test(c.name)) || gltf.animations[0];
      const attack=gltf.animations.find(c=>/attack|punch|jab|hit/i.test(c.name));
      if(idle){ mixer.clipAction(idle).play(); }
      mesh.userData.mixer=mixer; mesh.userData.attackClip=attack||null; mesh.userData.idleClip=idle||null; mesh.userData.clips=gltf.animations;
      mixers.push(mixer);
      gltfPreloaded[kind]=mesh;
      if(typeof trySwap==='function') trySwap(kind);   // el modelo llegó → reemplazar en juego
      resolve(true);
    }, undefined, ()=>resolve(false)); // sin archivo → respaldo procedural
  });
}

// ── Sonidos (Web Audio API, sin archivos externos) ────────────────────────
let audioCtx=null;
function sfx(kind){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const t=audioCtx.currentTime;
    const gain=audioCtx.createGain(); gain.connect(audioCtx.destination);
    const noise=(dur,freq,type,vol)=>{
      const b=audioCtx.createBuffer(1,Math.floor(audioCtx.sampleRate*dur),audioCtx.sampleRate);
      const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
      const s=audioCtx.createBufferSource(); s.buffer=b;
      const f=audioCtx.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=freq; f.Q.value=1;
      const g2=audioCtx.createGain(); g2.gain.setValueAtTime(vol||.3,t); g2.gain.exponentialRampToValueAtTime(.001,t+dur);
      s.connect(f); f.connect(g2); g2.connect(audioCtx.destination); s.start(t); s.stop(t+dur+.02);
    };
    const tone=(type,f0,f1,dur,vol)=>{
      const o=audioCtx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f0,t);
      if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
      o.connect(gain); gain.gain.setValueAtTime(vol||.25,t); gain.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.start(t); o.stop(t+dur+.02);
    };
    switch(kind){
      case 'punch': tone('sine',150,70,.12,.3); noise(.06,900,'lowpass',.22); break;
      case 'kick': tone('sine',110,55,.16,.35); noise(.07,600,'lowpass',.28); break;
      case 'sword': tone('square',720,180,.17,.22); noise(.17,2400,'highpass',.18); break;
      case 'hammer': tone('sine',95,42,.34,.45); noise(.15,520,'lowpass',.3); break;
      case 'nunchaku': tone('triangle',1500,1100,.06,.25); setTimeout(()=>sfx('punch'),70); break;
      case 'spear': noise(.12,1800,'bandpass',.22); tone('triangle',900,600,.1,.18); break;
      case 'plasma': tone('sawtooth',880,240,.2,.3); noise(.09,1500,'highpass',.14); break;
      case 'block': tone('triangle',1250,1250,.1,.22); break;
      case 'special': tone('sawtooth',180,760,.4,.3); break;
      case 'combo': tone('square',600,880,.09,.18); break;
      case 'launcher': tone('sine',160,850,.3,.3); noise(.18,900,'bandpass',.15); break;
      case 'slam': tone('sine',120,35,.24,.4); noise(.2,420,'lowpass',.32); break;
      case 'stone': noise(.08,700,'lowpass',.3); tone('triangle',300,140,.07,.15); break;
      case 'pickup': [660,880,1100].forEach((n,i)=>setTimeout(()=>tone('sine',n,n,.12,.2),i*70)); break;
      case 'legendary': [523,659,784,1047].forEach((n,i)=>setTimeout(()=>{
        try{
          const o=audioCtx.createOscillator(), g=audioCtx.createGain();
          o.type='square'; o.frequency.value=n; o.connect(g); g.connect(audioCtx.destination);
          const tt=audioCtx.currentTime; g.gain.setValueAtTime(.2,tt); g.gain.exponentialRampToValueAtTime(.001,tt+.16);
          o.start(tt); o.stop(tt+.18);
        }catch(e){}
      }, i*90)); break;
    }
  }catch(e){ /* sin audio */ }
}

let legendaryState=null, legendaryClock=9;
const legendaryPickupR=1.35;
function spawnLegendary(){
  if(legendaryState) return;
  const t=LEGENDARIES[Math.floor(Math.random()*LEGENDARIES.length)];
  const g=new THREE.Group();

  hilt.position.y=1.05; g.add(hilt);
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(.28,1.1,10,8,1,true), new THREE.MeshBasicMaterial({color:t.color, transparent:true, opacity:.3, side:THREE.DoubleSide}));
  beam.position.y=5.1; g.add(beam);
  const light=new THREE.PointLight(t.color, 12, 7); light.position.y=1.6; g.add(light);
  // aparece algo alejada del centro pero dentro del encuadre de cámara
  if(new URLSearchParams(location.search).get('legendarydemo')){ g.position.set(2.3,0,1.2); }
  else { const a=Math.random()*Math.PI*2; g.position.set(Math.cos(a)*3.2, 0, Math.sin(a)*3.2); }
  scene.add(g);
  legendaryState={mesh:g, t, age:0};
  showToast('¡ARMA LEGENDARIA está en la arena! 🐉');
}
function pickLegendary(f){
  const t=legendaryState.t;
  scene.remove(legendaryState.mesh);
  legendaryState=null;
  legendaryClock=26;
  f.prevWeapon=f.weapon||WEAPONS.fists;
  f.weapon=WEAPONS[t.weapon];
  f.legendaryUntil=22;
  attachWeapon(f);
  showToast('¡'+t.label+'! 🔥 daño legendario');
  sfx('legendary');
}
function updateLegendary(dt){
  legendaryClock-=dt;
  if(legendaryClock<=0){ legendaryClock=24; spawnLegendary(); }
  if(!legendaryState) return;
  const m=legendaryState.mesh;
  legendaryState.age+=dt;
  m.rotation.y+=dt*1.6;
  m.position.y=Math.sin(performance.now()*.0022)*.15;
  if(legendaryState.age>1.5){ // período de gracia: todos la ven antes de que alguien la tome
    for(const f of [p1,p2]){
      if(Math.hypot(f.pos.x-m.position.x, f.pos.z-m.position.z)<legendaryPickupR){ pickLegendary(f); break; }
    }
  }
}
function revertLegendary(f){
  if(f.legendaryUntil>0 || f.prevWeapon){
    f.weapon=f.prevWeapon||WEAPONS.fists; f.prevWeapon=null; f.legendaryUntil=0;
    attachWeapon(f);
  }
}
function updateLegendaryTimers(dt){
  for(const f of [p1,p2]){
    if(f.shieldT>0){
      f.shieldT-=dt;
      if(!f.shieldMesh){
        f.shieldMesh=new THREE.Mesh(new THREE.SphereGeometry(1.15,18,14), new THREE.MeshBasicMaterial({color:0x60a5fa, transparent:true, opacity:.22, side:THREE.DoubleSide, depthWrite:false}));
        f.shieldMesh.position.y=1.3; f.mesh.add(f.shieldMesh);
      }
      f.shieldMesh.material.opacity=.16+Math.abs(Math.sin(performance.now()*.006))*.12;
    } else if(f.shieldMesh){
      f.shieldMesh.parent && f.shieldMesh.parent.remove(f.shieldMesh); f.shieldMesh=null;
    }
    if(f.legendaryUntil>0){
      f.legendaryUntil-=dt;
      if(f.legendaryUntil<=0){
        f.weapon=f.prevWeapon||WEAPONS.fists; f.prevWeapon=null; attachWeapon(f);
        showToast('El arma legendaria se desvanece...');
      }
    }
  }
}

  const r=base.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=(t.clientX-cx)/45, dy=(t.clientY-cy)/45; const m=Math.hypot(dx,dy); if(m>1){dx/=m;dy/=m;}
  joy.x=dx; joy.y=dy; setKnob(dx,dy);
},{passive:false});
const endTouch=e=>{ if([...e.changedTouches].some(t=>t.identifier===joy.id)){joy.x=joy.y=0;joy.active=false;setKnob(0,0);} };
base.addEventListener('touchend',endTouch); base.addEventListener('touchcancel',endTouch);

function faceTo(f, other){ f.facing=Math.atan2(other.pos.x-f.pos.x, other.pos.z-f.pos.z); f.mesh.rotation.y=f.facing; }
function dist(a,b){ return a.pos.distanceTo(b.pos); }

// ── [MK] Núcleo de combate: MOVES con ventanas activas sincronizadas al loop ──
// Cada move tiene duración, instante de impacto (hitAt), alcance, daño y cancel.
// El golpe se resuelve en updateCombat (respeta timeScale) con cono de facing ~70°.
const MOVES={
  punch1:  {clip:'Punch1',        dur:.38, hitAt:.16, range:1.9, dmg:7,  kb:1.5, cancel:['punch2','kick'], cancelFrom:.18, cancelTo:.34, sfx:'punch'},
  punch2:  {clip:'Punch2',        dur:.46, hitAt:.22, range:2.0, dmg:10, kb:3.5, cancel:['kick','special'],cancelFrom:.24, cancelTo:.42, sfx:'punch'},
  kick:    {clip:'Kick',          dur:.55, hitAt:.26, range:2.3, dmg:13, kb:5,   cancel:['special'],       cancelFrom:.28, cancelTo:.50, sfx:'kick'},
  launcher:{clip:'Uppercut',      dur:.62, hitAt:.24, range:1.8, dmg:9,  kb:0,   launch:true, sfx:'launcher'},
  sword:   {clip:'SwordAttack',   dur:.60, hitAt:.28, range:2.1, dmg:11, kb:4,   cancel:['kick'],          cancelFrom:.30, cancelTo:.55, weapon:true, sfx:'sword'},
  hammer:  {clip:'Hammer_Overhead',dur:.72,hitAt:.36, range:1.9, dmg:16, kb:6.5, heavy:true, weapon:true, sfx:'hammer'},
};
function specialMove(f){
  if(f.kind==='hd_ninja')  return {clip:'Punch2',      dur:.60, hitAt:.30, range:2.2, dmg:18, kb:4, dash:2.5, sfx:'special'};
  if(f.kind==='hd_soldier')return {clip:'Special_Cast',dur:.55, hitAt:.28, range:0,   dmg:20, projectile:true, sfx:'special'};
  if(f.kind==='hd_ronin')  return {clip:'SwordAttack', dur:.60, hitAt:.30, range:4.0, dmg:18, kb:3, wave:true, sfx:'special'};
  return {clip:'Special_Cast', dur:.60, hitAt:.30, range:0, dmg:20, projectile:true, rasendan:true, sfx:'special'}; // legacy: Rasendan
}
function resolveMove(f,type){
  const w=weaponOf(f);
  let m;
  if(type==='special') m=specialMove(f);
  else if(type==='launcher') m=MOVES.launcher;
  else if(type==='kick') m=MOVES.kick;
  else if(type==='punch2') m=MOVES.punch2;
  else {
    if(w.key==='hammer'||w.key==='mjolnir') m=MOVES.hammer;
    else if(w.kind==='melee'&&w.key!=='fists') m=MOVES.sword;
    else if(w.kind==='ranged') m={...MOVES.punch1, projectile:true, clip:'Special_Cast', sfx:'plasma'};
    else m=MOVES.punch1;
  }
  m={...m};
  const reach=w.kind==='melee'?(w.range/3.4):1;   // alcance relativo del arma sobre la base MK
  if(!m.projectile) m.range=(m.range||1.9)*reach;
  m.dmg=Math.max(1,Math.round((m.dmg||10)*w.dmg));
  m.heavy=m.heavy||w.key==='hammer'||w.key==='mjolnir';
  m.weaponKey=w.key;
  return m;
}
function startMove(f,type){
  const m=resolveMove(f,type);
  f.move=m; f.moveName=type; f.attackT=0; f.attackHit=false;
  f.state='attack'; f.timer=m.dur; f.attackType=type; f.blocking=false;
  if(type==='special'){ f.energy-=35; }
  const target=f===p1?p2:p1;
  faceTo(f,target);   // auto-face: en arena libre el ataque mira al rival
  if(m.dash) f.dash={speed:m.dash/m.hitAt, left:m.dash};
  playFightAnim(f,m.clip);
  if(f===p1){ if(dist(p1,p2)<3.2) p2.memory.closeAttacks++; else p2.memory.farAttacks++; }
}
function tryAttack(f,type){
  if(roundOver||f.hurt>0||f.air||f.knockdown>0||f.getup>0||f.blockstun>0) return;
  if(f.jump) return;   // en salto propio solo el juggle automático golpea
  if(f.move){
    // [MK] cancel: encadena si el golpe anterior conectó y estás en la ventana
    const m=f.move;
    if(f.attackHit && m.cancel && m.cancel.includes(type) && f.attackT>=m.cancelFrom && f.attackT<=m.cancelTo){
      startMove(f,type);
    }
    return;
  }
  if(f.cooldown>0) return;
  if(type==='special' && f.energy<35){ if(f===p1) showToast('Necesitas 35⚡'); return; }
  startMove(f,type);
}
function tryJump(f){
  if(roundOver||f.jump||f.air||f.move||f.hurt>0||f.knockdown>0||f.getup>0) return;
  f.jump={vy:5.5}; f.blocking=false;
  playFightAnim(f,'JumpStart'); sfx('launcher');
}
function knockdown(f){
  f.move=null; f.state='down'; f.knockdown=.8; f.blocking=false;
  playFightAnim(f,'Knockdown'); sfx('slam');
}
function resolveHit(f,m){
  const target=f===p1?p2:p1;
  if(roundOver||target.hp<=0) return;
  const dir=new THREE.Vector3().subVectors(target.pos,f.pos); dir.y=0;
  const d=dir.length()||1; dir.divideScalar(d);
  const fwd=new THREE.Vector3(Math.sin(f.facing),0,Math.cos(f.facing));
  if(d>m.range || fwd.dot(dir)<=.35 || target.invuln>0) return;   // whiff: fuera de alcance/cono
  // Qwen/Grok esquivan a veces (solo contra el jugador)
  if(f===p1 && p2.persona==='qwen' && Math.random()<.18){
    p2.pos.x+=(Math.random()<.5?-1.2:1.2); clampArena(p2);
    showToast('¡'+p2.name+' (Qwen) te esquivó! ⚡'); return;
  }
  if(f===p1 && p2.persona==='grok' && Math.random()<.12){
    p2.pos.x+=(Math.random()<.5?-1:1); clampArena(p2);
    showToast('¡Grok se movió por caos! 🤪'); return;
  }
  let dmg=m.dmg;
  if(f===p2) dmg=Math.round(dmg*(.85+p2.memory.aggression*.4)*p2.cfg().dmgBonus);
  dmg=Math.max(1,Math.round(dmg*comboBonus(f)));
  const dealt=target.hit(dmg,f,m.heavy,!!m.rasendan);
  registerHit(f,target.lastBlocked?0:dealt);
  damagePillars(target.pos.x,1.5,target.pos.z,dmg*1.4,f);
  if(dealt>0 && !target.lastBlocked){
    sfx(m.sfx||'punch');
    if(m.rasendan||m.wave) burst(target.pos.x,1.4,target.pos.z,0xa78bfa);
    if(m.launch && !target.air && target.hp>0){
      target.air={vy:6.8}; target.blocking=false; target.state='air'; target.move=null;
      f.aerial={victim:target,hits:3,next:.4,t:0};
      burst(target.pos.x,.8,target.pos.z,0x38bdf8);
      shakeT=.4; timeScale=.45;
      showToast(target===p1?'🚀 ¡'+f.name+' te lanzó al aire!':'🚀 ¡RIVAL LANZADO! Sigue el combo aéreo');
    } else if(m.heavy && !target.air && target.hp>0){
      knockdown(target);
    }
    if(m.rasendan){ f.cooldown=Math.min(f.cooldown,.3); showToast('🌀 ¡RASENDAN! Sigue el combo'); }
  }
  if(target.hp<=0) endRound(f);
}
function updateCombat(dt){
  for(const f of [p1,p2]){
    if(f.blockstun>0) f.blockstun-=dt;
    if(f.invuln>0) f.invuln-=dt;
    if(f.knockdown>0){
      f.knockdown-=dt;
      if(f.knockdown<=0){ f.getup=.7; f.invuln=.75; f.state='getup'; playFightAnim(f,'Getup'); }
      continue;
    }
    if(f.getup>0){ f.getup-=dt; if(f.getup<=0) f.state='idle'; continue; }
    if(f.jump){
      f.jump.vy-=14*dt; f.pos.y+=f.jump.vy*dt;
      if(f.pos.y<=.3){ f.pos.y=.3; f.jump=null; playFightAnim(f,'JumpLand'); burst(f.pos.x,.35,f.pos.z,0x94a3b8); }
    }
    if(f.dash){
      const step=Math.min(f.dash.left,f.dash.speed*dt);
      f.pos.x+=Math.sin(f.facing)*step; f.pos.z+=Math.cos(f.facing)*step;
      f.dash.left-=step; clampArena(f); collidePillars(f);
      if(f.dash.left<=0) f.dash=null;
    }
    if(!f.move) continue;
    const m=f.move;
    f.attackT+=dt;
    if(!f.attackHit && f.attackT>=m.hitAt){
      f.attackHit=true;
      if(m.projectile){
        if(!roundOver){ spawnPlasma(f,m.rasendan?'special':'punch'); sfx(m.rasendan?'special':'plasma'); }
      } else resolveHit(f,m);
    }
    if(f.attackT>=m.dur){
      f.move=null; f.moveName=null; f.state='idle';
      f.cooldown=Math.max(f.cooldown,.12*weaponOf(f).cd);
    }
  }
}
// ── [MK/HD] Máquina de estados de animación (clips HD; legacy usa Idle/Attack) ──
const ATK_CLIPS=['Punch1','Punch2','Kick','Uppercut','SwordAttack','Special_Cast','Hammer_Overhead'];
const LOOP_CLIPS=['Idle','Idle2','Walk','Run','Block'];
function playFightAnim(f,name,fade=.12){
  const u=f.mesh.userData;
  if(u.hd && u.mixer){
    const clip=(u.hdClips&&u.hdClips[name])||null;
    if(!clip) return;
    const next=u.mixer.clipAction(clip);
    if(u.animCur===next && next.isRunning()) return;
    const once=!LOOP_CLIPS.includes(name);
    next.reset();
    next.setLoop(once?THREE.LoopOnce:THREE.LoopRepeat, once?1:Infinity);
    next.clampWhenFinished=once;
    if(u.animCur && u.animCur!==next) u.animCur.fadeOut(fade);
    next.fadeIn(fade).play();
    u.animCur=next;
    return;
  }
  if(u.isGltf && u.mixer){
    const isAtk=ATK_CLIPS.includes(name);
    const clip=isAtk?u.attackClip:u.idleClip;
    if(!clip) return;
    const a=u.mixer.clipAction(clip);
    a.reset(); a.setLoop(isAtk?THREE.LoopOnce:THREE.LoopRepeat, isAtk?1:Infinity);
    a.clampWhenFinished=isAtk; a.play();
  }
}
function updateFightAnim(f){
  const u=f.mesh.userData;
  if(!u.hd) return;
  if(koState && koState.loser===f){ playFightAnim(f,'KO'); return; }
  if(koState && koState.winner===f){ playFightAnim(f,'Victory'); return; }
  if(f.move||f.knockdown>0||f.getup>0||f.air) return;
  if(f.blocking||f.blockstun>0){ playFightAnim(f,'Block'); return; }
  if(f.jump){ playFightAnim(f,f.jump.vy>1?'JumpStart':'JumpLoop'); return; }
  if(f._speed>4.2) playFightAnim(f,'Run');
  else if(f._speed>.5) playFightAnim(f,'Walk');
  else playFightAnim(f,'Idle');
}

function adaptiveBrain(dt){
  if(debugFreezeAI) return;
  // La IA aprende según su personalidad: si el jugador ataca mucho de cerca → sube defensa; si se aleja → persigue más
  const m=p2.memory;
  const cfg=p2.cfg();
  const learnedDef = Math.min(.9, cfg.def + m.closeAttacks*.03 + m.blocks*.02);
  const learnedAggr = Math.min(.95, cfg.aggr + (m.farAttacks> m.closeAttacks? .08:0) + (100-p2.hp)*.002);
  if(p2.persona==='openai'){
    m.defense=Math.min(.9, .55 + (m.closeAttacks>6 ? .2 : 0));
    m.aggression=.55 + (p2.energy>70 ? .25 : 0);
  } else if(p2.persona==='qwen'){
    // Qwen: velocidad máxima, presiona sin pausa y esquiva lateral para contraatacar
    m.defense=.22; m.aggression=.9 + (Math.random()<.02 ? (Math.random()-.5)*.15 : 0);
  } else if(p2.persona==='grok'){
    // Grok: caos total, ignora memoria — hace movimientos impredecibles, ataca aunque esté lejos, a veces se queda quieto
    m.defense=Math.random()*.5; m.aggression=.86;
  } else if(p2.persona==='gemini'){
    // Gemini: paciente y defensiva, deja que te canses (espera y contraataca)
    m.defense=.82; m.aggression=.34 + (p1.hp < p2.hp ? .15 : 0);
  } else if(p2.persona==='deepseek'){
    // DeepSeek: busca debilidad — si atacas mucho de cerca, persigue y usa patada; si huyes, carga especial
    m.defense=Math.min(.9, .6 + m.closeAttacks*.02);
    m.aggression=.5 + (m.farAttacks > m.closeAttacks ? .25 : 0);
  }
  m.danger += (p1.state==='attack'?1:0)*dt;

  if(p2.hurt>0||p2.air||p2.aerial||roundOver||p2.knockdown>0||p2.getup>0||p2.blockstun>0) return;
  const d=dist(p1,p2);
  faceTo(p2,p1);
  p2.timer-=dt; p2.cooldown-=dt;
  if(p2.move) return;   // [MK] el move activo se resuelve en updateCombat
  if(p2.state==='attack') p2.state='idle';
  // [MK] bloqueo reactivo: el rival ataca cerca → cubrirse según defensa aprendida
  if(p1.move && d<3.2 && Math.random()<learnedDef*.55){
    p2.blocking=true; p2.state='block'; p2.timer=.35+.3*m.defense;
    return;
  }
  // [MK] anti-aéreo: rival saltando/lanzando → patada o launcher
  if((p1.jump||p1.air) && d<3 && p2.cooldown<=0 && Math.random()<.5){
    p2.blocking=false; tryAttack(p2, p1.air?'launcher':'kick'); return;
  }

  // Decisión con memoria + personalidad
  const r=Math.random();
  const speed=cfg.speed;
  // Frases según personalidad
  if(Math.random()<.012){
    const phrases={
      openai:['Analizando... 🤖','Estrategia calculada ✔','Respuesta óptima','Calibrando ataque','Procesando tu patrón'],
      qwen:['⚡ Velocidad máxima','Combo ejecutado','Sin pausa','Más rápido que tú','Qwen ataca'],
      grok:['¡JA! 🤪','¿Eso es todo?','¡Mi caos te gana!','Jeee, predecible no soy'],
      gemini:['Con calma... 💎','El truco es la paciencia','Calculé ese golpe','Ahora sí, mi turno','Multimodal: te veo todo'],
      deepseek:['Buscando patrón... 🔍','Tu debilidad: cerca','Copiando tu estilo','Detectada tu falla']
    };
    const arr=phrases[p2.persona] || phrases.qwen;
    if(arr) showToast(arr[Math.floor(Math.random()*arr.length)]);
  }
  // La IA a veces va por los objetos del ring (armas, botiquín, energía, escudo)
  let seekPickup=false;
  if(Math.random()<0.07){
    const it=nearestPickup();
    if(it){
      const dx=it.x-p2.pos.x, dz=it.z-p2.pos.z, dd=Math.hypot(dx,dz)||1;
      const fwd={x:Math.sin(p2.facing), z:Math.cos(p2.facing)};
      const right={x:fwd.z, z:-fwd.x};
      const wx=dx/dd, wz=dz/dd;
      moveAI(wx*right.x+wz*right.z, wx*fwd.x+wz*fwd.z, speed*dt);
      seekPickup=true;
    }
  }
  if(seekPickup){ /* moviéndose al objeto: no ataca este tick */ }
  else if(p2.persona==='qwen' && Math.random()<0.10){
    // Qwen: esquiva lateral rápido y luego contraataca
    moveAI(Math.random()<.5?-2.2:2.2, -1, speed*dt);
    if(r<m.aggression*.8 && p2.cooldown<=0){ setTimeout(()=>{if(!roundOver){p2.blocking=false; tryAttack(p2,'special');}},180); }
  }
  else if(p2.persona==='grok' && Math.random()<0.20){
    // Grok hace giros locos sin importar la distancia
    moveAI(Math.random()<.5?-2:2, -1.5, speed*1.2*dt);
    if(Math.random()<.7 && p2.cooldown<=0){ const a=['punch','kick','special']; tryAttack(p2, a[Math.floor(Math.random()*3)]); }
  }
  else if(p2.persona==='gemini' && d>3 && Math.random()<0.10){
    // Gemini espera paciente, deja que te acerques
    // no attack, solo espera
  }
  else if(p2.persona==='openai' && p2.energy>=35 && d<=5 && Math.random()<0.18){
    tryAttack(p2,'special'); // OpenAI usa especial estratégico
  }
  else if(Math.random()<m.defense) { p2.blocking=true; p2.state='block'; p2.timer=.5+.4*m.defense; 
    if(r<m.aggression*.6 && p2.cooldown<=0){ setTimeout(()=>{if(!roundOver){p2.blocking=false; tryAttack(p2,'punch');}},220); }
  }
  else if(d>4.5){ moveAI(0,1,speed*dt); if(r<m.aggression) tryAttack(p2,'special'); }
  else if(d>2.6){ moveAI(0,1,speed*dt); if(r<m.aggression*.7) tryAttack(p2, Math.random()<.4?'kick':'punch'); }
  else { // cerca
    // La IA también lanza al aire y remata aéreo (estilo ENENRA)
    if(!p1.air && r<m.aggression*.28 && p1.hp>0){ tryAttack(p2,'launcher'); }
    else if(r<m.aggression) tryAttack(p2, Math.random()<.5?'punch':'kick');
    else if(r<m.aggression+m.defense*.5){ p2.blocking=true; p2.state='block'; p2.timer=.4; }
    else moveAI(1,0,speed*.55*dt); // esquiva lateral
  }
  if(p2.state==='block'&&p2.timer<=0){p2.blocking=false;p2.state='idle';}
  p2.energy=Math.min(100,p2.energy+dt*3);
  document.getElementById('style1').textContent = cfg.label;
  document.getElementById('blockStat').textContent = Math.round(m.defense*100)+'%';
  document.getElementById('counterStat').textContent = m.counters;
}
function moveAI(x,z,speed){
  const fwd=new THREE.Vector3(Math.sin(p2.facing),0,Math.cos(p2.facing));
  const right=new THREE.Vector3(fwd.z,0,-fwd.x);
  p2.pos.addScaledVector(fwd,z*speed).addScaledVector(right,x*speed);
  clampArena(p2); collidePillars(p2);
}
function clampArena(f){ f.pos.x=THREE.MathUtils.clamp(f.pos.x,-7.5,7.5); f.pos.z=THREE.MathUtils.clamp(f.pos.z,-7.5,7.5); }

// ── [MK] Match state: INTRO → FIGHT → KO → (FINISH HIM → FATALITY) → siguiente ronda ──
let wins1=0,wins2=0,timeLeft=99;
let matchState='INTRO', roundNum=1, introT=0;
let finishT=0, finishBuf=[], finishWinner=null, cinematic=null;
function updateScore(){
  document.getElementById('wins').textContent=`${wins1} - ${wins2}`;
  document.getElementById('pips1').textContent=(wins1>=1?'●':'○')+' '+(wins1>=2?'●':'○');
  document.getElementById('pips2').textContent=(wins2>=1?'●':'○')+' '+(wins2>=2?'●':'○');
}
function startRound(rotate){
  p1.reset(-3,0); p2.reset(3,0);
  revertLegendary(p1); revertLegendary(p2);
  p2.weapon=WEAPONS[randomWeaponKey()]; attachWeapon(p2);
  p1.combo=p2.combo=0; koState=null; cinematic=null;
  p1.mesh.rotation.x=0; p2.mesh.rotation.x=0;
  resetPillars(); resetPickups();
  if(rotate){ applyArena(arenaIdx+1); showToast(ARENAS[arenaIdx].icon+' ¡Nueva arena: '+ARENAS[arenaIdx].name+'!'); }
  timeLeft=99; document.getElementById('timer').textContent='99';
  document.getElementById('roundNum').textContent=roundNum;
  matchState='INTRO'; introT=0; roundOver=true;
  const b=document.getElementById('banner'); b.textContent='🥋 RONDA '+roundNum; b.style.display='block';
  playFightAnim(p1,'Idle'); playFightAnim(p2,'Idle');
}
function startMatch(){
  wins1=0; wins2=0; roundNum=1; updateScore();
  document.getElementById('victoryOverlay').classList.remove('on');
  document.getElementById('finishOverlay').classList.remove('on');
  startRound(false);
}
function endRound(winner){
  if(roundOver) return;
  roundOver=true; matchState='KO';
  timeScale=.22;  // slow-motion dramático en el KO
  const loser = winner===p1 ? p2 : p1;
  koState={loser, winner, t:0};
  shakeT=.6;
  if(winner===p1) wins1++; else wins2++;
  updateScore();
  const b=document.getElementById('banner'); b.textContent=`🏆 ¡${winner.name} GANA LA RONDA!`; b.style.display='block';
  burst(winner.pos.x,2,winner.pos.z,winner===p1?0x38bdf8:0xff6600);
  const matchPoint=(winner===p1?wins1:wins2)>=2;   // best-of-3: FINISH HIM solo en match point
  setTimeout(()=>{
    if(matchState!=='KO') return;
    b.style.display='none';
    if(matchPoint) enterFinish(winner);
    else { roundNum++; startRound(true); }
  }, matchPoint?1400:2600);
}
function enterFinish(winner){
  if(matchState!=='KO') return;
  matchState='FINISH'; finishWinner=winner; finishT=3.0; finishBuf=[];
  const loser=winner===p1?p2:p1;
  document.querySelector('.finishTitle').textContent=loser===p2?'FINISH HIM':'FINISH HER';
  document.querySelectorAll('.finishSeq span').forEach(s=>s.classList.remove('done'));
  document.getElementById('finishOverlay').classList.add('on');
  sfx('special');
  if(autoMode){
    // la IA ganadora intenta la fatality (60%) tras 0.8-1.5 s
    setTimeout(()=>{ if(matchState==='FINISH' && Math.random()<.6) executeFatality(finishWinner); },800+Math.random()*700);
  }
}
function finishInput(k){
  if(matchState!=='FINISH'||autoMode) return;
  const seq=['j','k','l'];
  if(k===seq[finishBuf.length]){
    finishBuf.push(k);
    document.querySelectorAll('.finishSeq span')[finishBuf.length-1].classList.add('done');
    sfx('combo');
    if(finishBuf.length===seq.length) executeFatality(finishWinner);
  } else {
    finishBuf=[];
    document.querySelectorAll('.finishSeq span').forEach(s=>s.classList.remove('done'));
  }
}
function executeFatality(winner){
  if(matchState!=='FINISH') return;
  matchState='FATALITY';
  document.getElementById('finishOverlay').classList.remove('on');
  const loser=winner===p1?p2:p1;
  cinematic={t:0,dur:2.2,winner,loser,struck:false,killed:false};
  timeScale=.25;
  faceTo(winner,loser);
  sfx('launcher');
}
function matchEnd(winner,fatality){
  matchState='MATCH_END'; roundOver=true; cinematic=null; timeScale=1;
  document.getElementById('banner').style.display='none';
  document.getElementById('finishOverlay').classList.remove('on');
  document.getElementById('victoryName').textContent=winner.name+' gana el combate';
  document.getElementById('victoryFatality').classList.toggle('on',!!fatality);
  document.getElementById('victoryTitle').textContent=winner===p1?'🏆 ¡VICTORIA!':'💀 DERROTA';
  document.getElementById('victoryOverlay').classList.add('on');
  playFightAnim(winner,'Victory');
}
function updateMatch(rdt){
  const b=document.getElementById('banner');
  if(matchState==='INTRO'){
    introT+=rdt;
    if(introT>=.7 && introT<1.4){ b.textContent='⚔️ ¡FIGHT!'; b.style.display='block'; }
    if(introT>=1.4){ matchState='FIGHT'; roundOver=false; b.style.display='none'; }
  } else if(matchState==='FINISH'){
    finishT-=rdt;   // ventana en tiempo real (no escalada por slow-mo)
    document.getElementById('finishTimer').textContent=Math.max(0,finishT).toFixed(1);
    if(finishT<=0) matchEnd(finishWinner,false);
  } else if(matchState==='FATALITY' && cinematic){
    const c=cinematic; c.t+=rdt;
    if(!c.struck && c.t>=.9){
      c.struck=true;
      playFightAnim(c.winner,'SwordAttack');
      sfx('sword');
    }
    if(!c.killed && c.t>=1.3){
      c.killed=true;
      koState={loser:c.loser,winner:c.winner,t:0};
      burst(c.loser.pos.x,1.4,c.loser.pos.z,0xef4444);
      burst(c.loser.pos.x,1.9,c.loser.pos.z,0xb91c1c);
      burst(c.loser.pos.x,.9,c.loser.pos.z,0xef4444);
      shakeT=.8; sfx('slam'); sfx('hammer');
      b.textContent='🩸 FATALITY'; b.style.display='block';
    }
    if(c.t>=c.dur) matchEnd(c.winner,true);
  }
}
setInterval(()=>{
  if(matchState!=='FIGHT') return;
  timeLeft--; document.getElementById('timer').textContent=Math.max(0,timeLeft);
  if(timeLeft<=0){
    if(p1.hp===p2.hp){ showToast('⏱️ ¡EMPATE! Se repite la ronda'); startRound(false); }
    else endRound(p1.hp>p2.hp?p1:p2);
  }
},1000);
document.getElementById('rematchBtn').onclick=()=>startMatch();

function playerUpdate(dt){
  p1.timer-=dt; p1.cooldown-=dt; if(p1.hurt>0)p1.hurt-=dt;
  if(p1.air||p1.aerial) return;   // en el aire no controlas (te lanzaron / combo aéreo)
  if(p1.knockdown>0||p1.getup>0) return;
  faceTo(p1,p2);
  // [MK] bloqueo del jugador: Shift/U hold (o botón 🛡️ táctil)
  const wantBlock=(keys['shift']||keys['u']||p1.touchBlock) && !autoMode;
  p1.blocking=!!(wantBlock && !p1.move && !p1.jump && p1.hurt<=0 && p1.blockstun<=0);
  if(p1.blocking) p1.state='block';
  let mx=0,mz=0;
  if(autoMode){
    // Ambos pelean solos cuando AUTO está ON (modo espectador IA vs IA)
    const d=dist(p1,p2);
    if(d>3) { mz=1; }
    else if(Math.random()<.03){
      tryAttack(p1, Math.random()<.22?'launcher':(Math.random()<.5?'punch':'kick'));
    }
    if(d<2 && Math.random()<.01) mz=-.6;
  } else if(!p1.move && !p1.blocking && p1.blockstun<=0){
    if(keys['w']||keys['arrowup']) mz+=1; if(keys['s']||keys['arrowdown']) mz-=1;
    if(keys['a']||keys['arrowleft']) mx-=1; if(keys['d']||keys['arrowright']) mx+=1;
    mx+=joy.x; mz+=-joy.y;
  }
  const len=Math.hypot(mx,mz); if(len>1){mx/=len;mz/=len;}
  const fwd=new THREE.Vector3(Math.sin(p1.facing),0,Math.cos(p1.facing));
  const right=new THREE.Vector3(fwd.z,0,-fwd.x);
  const spd=3.6*p1.speedMul*(p1.blocking?.35:1);
  p1.pos.addScaledVector(fwd,mz*spd*dt).addScaledVector(right,mx*spd*dt);
  clampArena(p1); collidePillars(p1);
  p1.energy=Math.min(100,p1.energy+dt*3);
  // animación brazos (solo para modelos procedurales — los glTF usan sus clips)
  const u=p1.mesh.userData;
  if(!u.isGltf){
    if(p1.move){ u.armR.rotation.x=-1.6; if(p1.attackType==='kick') u.legR.rotation.x=-1.2; else u.legR.rotation.x=0; }
    else { u.armR.rotation.x=0; u.legR.rotation.x=0; }
    if(p1.blocking){ u.armL.rotation.x=-.9; u.armR.rotation.x=-.9; }
    if(p1.knockdown>0){ p1.mesh.rotation.x=-1.3; }
    else if(p1.getup>0){ p1.mesh.rotation.x=-1.3*(p1.getup/.7); }
  }
}

function aiAnim(dt){
  p2.timer-=dt; p2.cooldown-=dt; if(p2.hurt>0)p2.hurt-=dt;
  const u=p2.mesh.userData;
  if(!u.isGltf){
    if(p2.move){ u.armR.rotation.x=-1.6; if(p2.attackType==='kick') u.legR.rotation.x=-1.2; else u.legR.rotation.x=0; }
    else { u.armR.rotation.x=0; u.legR.rotation.x=0; }
    if(p2.blocking){ u.armL.rotation.x=-.9; u.armR.rotation.x=-.9; }
    if(p2.knockdown>0){ p2.mesh.rotation.x=-1.3; }
    else if(p2.getup>0){ p2.mesh.rotation.x=-1.3*(p2.getup/.7); }
  }
  if(!p2.air&&!p2.aerial&&!p2.jump&&p2.pos.y<=.32) p2.mesh.position.y = .3 + Math.sin(performance.now()*.006)*.04;
  if(!p1.air&&!p1.aerial&&!p1.jump&&p1.pos.y<=.32) p1.mesh.position.y = .3 + Math.sin(performance.now()*.006+2)*.04;
}

function updateWalkAnim(dt){
  for(const f of [p1,p2]){
    const u=f.mesh.userData;
    const last=f._lastPos||f.pos.clone();
    const dx=f.pos.x-last.x, dz=f.pos.z-last.z;
    f._lastPos=f.pos.clone();
    const speed=Math.hypot(dx,dz)/Math.max(dt,.001);
    f._speed=speed;   // [HD] selector walk/run en updateFightAnim
    if(u.isGltf){ updateFightAnim(f); }
    if(f.move||f.knockdown>0||f.getup>0||f.jump||f.air){
      // [MK] el clip/pose de ataque, caída o salto manda; no pisar con walk
    } else if(speed>.5){
      f.walkPhase=(f.walkPhase||0)+dt*speed*2.1;
      const s=Math.sin(f.walkPhase)*.65;
      u.legL.rotation.x=s; u.legR.rotation.x=-s;
      if(u.isGltf){ u.armL.rotation.x=-s*.55; u.armR.rotation.x=s*.55; }
    } else {
      const k=Math.pow(.02,dt);
      u.legL.rotation.x*=k; u.legR.rotation.x*=k;
      if(u.isGltf){ u.armL.rotation.x*=k; u.armR.rotation.x*=k; }
    }
    // reacción al impacto: inclinar hacia atrás + empujón que se desvanece
    f.hurtTilt=Math.max(0,(f.hurtTilt||0)-dt*2.2);
    if(!f.air && (!koState||koState.loser!==f)){
      if(!u.hd && f.knockdown<=0 && f.getup<=0) f.mesh.rotation.x=-f.hurtTilt*.4;
      if(f.kb.lengthSq()>0.01){
        f.pos.addScaledVector(f.kb,dt);
        f.kb.multiplyScalar(Math.exp(-5*dt));
        clampArena(f);
      }
    }
  }
}
function updateKo(dt){
  if(!koState) return;
  koState.t+=dt;
  const {loser, winner}=koState;
  const hdL=loser.mesh.userData.hd, hdW=winner.mesh.userData.hd;
  if(loser.air){ /* el KO en pausa aérea: lo maneja updateAereo hasta tocar suelo */ }
  else if(!hdL){
    const p=Math.min(1, koState.t*1.8);
    loser.mesh.rotation.x=-p*1.5;                 // cae hacia atrás y se hunde
    loser.mesh.position.y=.3-p*.3;
  }
  if(!hdW){
    const hop=Math.abs(Math.sin(koState.t*7))*.55*Math.max(0,1-koState.t/2.5);
    winner.mesh.position.y=.3+hop;                // salta de celebración
  }
}

// ── Combate aéreo estilo ENENRA: juggle del atacante + física de vuelo ──────
function updateAereo(dt){
  for(const f of [p1,p2]){
    // Física de la víctima en el aire
    if(f.air){
      f.air.vy-=15*dt;
      f.pos.y+=f.air.vy*dt;
      f.mesh.rotation.x=THREE.MathUtils.clamp(-f.air.vy*.07,-1.05,.55); // vuelve en el aire
      if(f.pos.y<=.3){ // aterrizaje: slam con polvo → knockdown MK (puede resquebrajar pilares)
        f.pos.y=.3; f.mesh.rotation.x=0; f.air=null;
        burst(f.pos.x,.4,f.pos.z,0x94a3b8); shakeT=.4; sfx('slam');
        damagePillars(f.pos.x,.4,f.pos.z, 20, null);
        if(f.hp>0 && !roundOver) knockdown(f); else f.state='idle';
      }
    }
    // Regreso suave del atacante tras terminar el combo aéreo
    if(!f.air&&!f.aerial&&!f.jump&&f.pos.y>.32){
      f.pos.y=Math.max(.3, f.pos.y-4.5*dt);
      if(f.pos.y<=.32) f.pos.y=.3;
    }
    // Ataques aéreos del atacante (juggle)
    if(f.aerial){
      const a=f.aerial, v=a.victim;
      if(roundOver||v.hp<=0||!v.air||a.hits<=0){ f.aerial=null; continue; }
      f.mesh.rotation.x=0;
      f.pos.y=.3+Math.max(.35, v.pos.y*.8-1);      // el atacante salta tras la víctima
      faceTo(f,v);
      if(a.t>=a.next){
        a.next+=.3; a.hits--;
        playFightAnim(f,'Punch1');
        let dmg=Math.round(9*weaponOf(f).dmg*comboBonus(f)*(f===p2?(.85+p2.memory.aggression*.4)*p2.cfg().dmgBonus:1));
        const dealt=v.hit(dmg,f,false);
        registerHit(f,dealt);
        damagePillars(v.pos.x,v.pos.y,v.pos.z, dmg, f); // el juggle puede romper pilares cercanos
        if(v.air) v.air.vy=Math.max(v.air.vy,3.2); // el juggle lo mantiene volando
        burst(v.pos.x,v.pos.y+.7,v.pos.z,0xfbbf24);
        shakeT=.25; sfx('punch');
        if(v.hp<=0){ endRound(f); continue; }
      }
      a.t+=dt;
    }
  }
}
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const rdt=Math.min(.05,clock.getDelta());
  if(timeScale<1) timeScale=Math.min(1, timeScale+rdt*(koState?.8:1.9)); // slow-mo se recupera
  const dt=rdt*timeScale;
  updateMatch(rdt);   // [MK] intro, ventana FINISH HIM, cinemática de fatality
  for(const mx of mixers) mx.update(dt);   // animaciones glTF (Blender / Tripo AI)
  decayCombo(dt);
  updateLegendary(dt);
  updateLegendaryTimers(dt);
  const comboEl=document.getElementById('combo');
  if(p1.combo>=2) comboEl.textContent='🔥 x'+p1.combo;
  else if(autoMode && p2.combo>=2) comboEl.textContent='🔥 '+p2.name+' x'+p2.combo;
  else comboEl.textContent='';
  if(!roundOver){ playerUpdate(dt); adaptiveBrain(dt); aiAnim(dt); }
  updateCombat(dt);   // [MK] ventanas activas, salto, dash, knockdown/getup
  updateWalkAnim(dt);
  updateAereo(dt);
  updatePillars(dt);
  updatePickups(dt);
  updateKo(dt);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.userData.life-=dt*1.4; p.position.addScaledVector(p.userData.v,dt); p.userData.v.y-=6*dt;
    p.scale.setScalar(Math.max(.01,p.userData.life)); if(p.userData.life<=0){scene.remove(p); particles.splice(i,1);}
  }
  // Proyectiles de plasma
  for(let i=projectiles.length-1;i>=0;i--){
    const pr=projectiles[i];
    pr.position.addScaledVector(pr.userData.v,dt);
    pr.userData.life-=dt;
    pr.rotation.x+=dt*8;
    if(pr.userData.rasendan){ if(pr.userData.ring1){pr.userData.ring1.rotation.z+=dt*14; pr.userData.ring1.rotation.x+=dt*6;} if(pr.userData.ring2){pr.userData.ring2.rotation.z-=dt*10;} if(Math.random()<.4) burst(pr.position.x,pr.position.y,pr.position.z,0x67e8f9); }
    const target = pr.userData.owner===p1 ? p2 : p1;
    // El plasma también impacta contra los pilares
    let hitPillar=false;
    for(const p of pillars){ if(p.alive && Math.hypot(pr.position.x-p.x, pr.position.z-p.z)<0.85 && pr.position.y<4){ hitPillar=true; break; } }
    if(hitPillar){
      damagePillars(pr.position.x,pr.position.y,pr.position.z, Math.round(pr.userData.dmg*1.2), pr.userData.owner);
      burst(pr.position.x,pr.position.y,pr.position.z,0x22d3ee);
      scene.remove(pr); projectiles.splice(i,1);
      continue;
    }
    if(pr.position.distanceTo(target.pos.clone().setY(1.3))<1.05){
      const w=weaponOf(pr.userData.owner);
      let dmg=Math.round(pr.userData.dmg*w.dmg*comboBonus(pr.userData.owner));
      const dealt=target.hit(dmg,pr.userData.owner, false, pr.userData.rasendan);
      registerHit(pr.userData.owner,dealt);
      if(pr.userData.rasendan && dealt>0){ pr.userData.owner.cooldown=Math.min(pr.userData.owner.cooldown,.25); showToast('🌀 ¡RASENDAN! Sigue el combo'); }
      damagePillars(pr.position.x,1.4,pr.position.z, dmg, pr.userData.owner);
      sfx('plasma');
      burst(pr.position.x,1.4,pr.position.z,0x22d3ee);
      scene.remove(pr); projectiles.splice(i,1);
      if(target.hp<=0) endRound(pr.userData.owner);
      continue;
    }
    if(pr.userData.life<=0 || Math.hypot(pr.position.x,pr.position.z)>11){
      scene.remove(pr); projectiles.splice(i,1);
    }
  }
  p1.mesh.position.copy(p1.pos); p2.mesh.position.copy(p2.pos);
  // cámara sigue el punto medio (o close-up del perdedor en la fatality)
  const mid=new THREE.Vector3().addVectors(p1.pos,p2.pos).multiplyScalar(.5);
  if(cinematic){
    const L=cinematic.loser;
    const a=L.facing+2.5;
    camera.position.lerp(new THREE.Vector3(L.pos.x+Math.sin(a)*3.4, L.pos.y+2.0, L.pos.z+Math.cos(a)*3.4),.07);
  } else {
    camera.position.lerp(new THREE.Vector3(mid.x*.6,7,11),.06);
  }
  if(shakeT>0){ // sacudida de cámara en golpes fuertes y KO
    shakeT-=dt;
    camera.position.x+=(Math.random()-.5)*shakeT*1.5;
    camera.position.y+=(Math.random()-.5)*shakeT*1.1;
  }
  if(cinematic){ const L=cinematic.loser; camera.lookAt(L.pos.x,L.pos.y+1,L.pos.z); }
  else camera.lookAt(mid.x, Math.max(1.2,(p1.pos.y+p2.pos.y)/2+.5), mid.z);
  document.getElementById('hp1').style.width=(p1.hp/(p1.maxHp||100)*100)+'%'; document.getElementById('hp1').className='fill hp'+(p1.hp/(p1.maxHp||100)<30?' low':'');
  document.getElementById('hp2').style.width=(p2.hp/(p2.maxHp||100)*100)+'%'; document.getElementById('hp2').className='fill hp'+(p2.hp/(p2.maxHp||100)<30?' low':'');
  document.getElementById('en1').style.width=p1.energy+'%'; document.getElementById('en2').style.width=p2.energy+'%';
  renderer.render(scene,camera);
}
// ── [MK] Hook de debug para E2E (solo con ?debug=1) ─────────────────────────
if(new URLSearchParams(location.search).has('debug')){
  window.__game={
    get state(){ return {matchState, roundNum, wins1, wins2, timeLeft, autoMode, roundOver,
      p1:{hp:p1.hp, maxHp:p1.maxHp, energy:p1.energy, x:p1.pos.x, y:p1.pos.y, z:p1.pos.z, blocking:p1.blocking, move:p1.move?p1.moveName:null, kind:p1.kind, jump:!!p1.jump, knockdown:p1.knockdown, invuln:p1.invuln},
      p2:{hp:p2.hp, maxHp:p2.maxHp, energy:p2.energy, x:p2.pos.x, y:p2.pos.y, z:p2.pos.z, blocking:p2.blocking, move:p2.move?p2.moveName:null, kind:p2.kind},
      mixers:mixers.length, finishBuf:[...finishBuf]}; },
    p1, p2, scene, renderer, camera, MOVES,
    setAuto(v){ autoMode=!!v; document.getElementById('autoBtn').textContent=autoMode?'🤖 AUTO: ON':'🎮 MANUAL'; },
    freezeAI(v){ debugFreezeAI=!!v; },
    attack(who,type){ tryAttack(who==='p1'?p1:p2,type); },
    jump(){ tryJump(p1); },
    block(v){ p1.touchBlock=!!v; },
    setWeapon(key){ p1.weapon=WEAPONS[key]; attachWeapon(p1); },
    forceKO(loser){ const L=loser==='p2'?p2:p1; L.hp=0; endRound(L===p1?p2:p1); },
    setHP(who,hp){ (who==='p1'?p1:p2).hp=hp; },
    teleport(who,x,z){ const f=who==='p1'?p1:p2; f.pos.x=x; f.pos.z=z; },
    clean(){ for(const f of [p1,p2]){ f.move=null; f.moveName=null; f.attackT=0; f.attackHit=false;
      f.hurt=0; f.blockstun=0; f.invuln=0; f.knockdown=0; f.getup=0; f.air=null; f.aerial=null;
      f.jump=null; f.dash=null; f.cooldown=0; f.blocking=false; f.state='idle'; f.pos.y=.3; } },
    finishInput, startMatch
  };
}
startMatch();   // [MK] arranca en RONDA 1 con intro
loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
